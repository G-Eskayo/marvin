name: CI

# The dashboard's unit tests on every PR and on main. The Python suite (lib/tests) is not run here yet: it needs a
# pinned requirements file (chromadb, sentence-transformers, torch) and some tests read machine-local state.
on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  dashboard-tests:
    name: Dashboard unit tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: dashboard
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: dashboard/package-lock.json
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - run: npx vitest run

  dictate-tests:
    # MARVIN Dictate (tools/dictate, marvin#730). The tests that run Apple's speech engine skip themselves when the
    # runner doesn't have the English model; the key, clean-up, clipboard and history tests always run.
    name: Dictate tests (macOS)
    runs-on: macos-26
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - run: swift test --package-path tools/dictate

  secret-scan:
    # ADR 0071: the server-side gate. Scans only the commits this PR or push adds, with gitleaks and with the same
    # bin/pre-push-guard every clone runs locally (shared patterns; personal ones never leave their owner's machine).
    name: Secret and transcript scan
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Commit range
        id: range
        run: |
          if [ "${{ github.event_name }}" = pull_request ]; then base="${{ github.event.pull_request.base.sha }}"; else base="${{ github.event.before }}"; fi
          if ! git cat-file -e "$base^{commit}" 2>/dev/null; then base=$(git rev-list --max-parents=0 HEAD | tail -1); fi
          echo "base=$base" >> "$GITHUB_OUTPUT"
      - name: Install gitleaks 8.30.1 (checksum-pinned)
        run: |
          curl -fsSLo gl.tgz https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz
          echo "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb  gl.tgz" | sha256sum -c -
          tar -xzf gl.tgz gitleaks && rm gl.tgz
      - name: gitleaks
        run: ./gitleaks git --no-banner --redact --config .gitleaks.toml --log-opts="${{ steps.range.outputs.base }}..HEAD" .
      - name: pre-push guard (shared patterns)
        run: |
          mkdir -p "$RUNNER_TEMP/home/.claude" && touch "$RUNNER_TEMP/home/.claude/private-push-patterns.txt"
          echo "refs/heads/ci $(git rev-parse HEAD) refs/heads/ci ${{ steps.range.outputs.base }}" \
            | HOME="$RUNNER_TEMP/home" bin/pre-push-guard origin
