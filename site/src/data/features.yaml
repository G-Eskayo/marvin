# Every MARVIN feature the site talks about, with its release status and evidence (marvin#1007, plan §3.1 and §4).
# One file so the docs index, each feature page's badge and the roadmap can't disagree.
#
# status:
#   released  merged to main AND run evidence in daily use (a loaded job, a log written in the last 7 days, an app)
#   testing   merged to main, but behind a flag, in shadow mode, or with no run evidence yet ("Built, in testing")
#   progress  partly merged to main, not usable end to end yet ("In progress"). Roadmap only, like planned.
#   planned   an ADR or open ticket, no merged implementation. Roadmap only: never a feature page, never a date.
#   retired   removed; kept so old links explain where it went
# verified_on: the day the evidence was last checked against main and the running system.
# page: the docs page slug (src/content/docs/docs/features/<page>.mdx). scripts/check.mjs fails the build when a
#   released feature has no evidence, a page is missing, or a planned feature has a page.
# ticket: planned items link here (G-Eskayo/marvin issue number).

areas:
  - id: memory
    title: Memory and knowledge
  - id: pipeline
    title: Works while you're away
  - id: control
    title: You stay in charge
  - id: visibility
    title: See what it's doing
  - id: machines
    title: Machines and upkeep
  - id: research
    title: Research and measurement

