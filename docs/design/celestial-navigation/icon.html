<!doctype html>
<html><head><meta charset="utf-8"><style>html,body{margin:0;background:#000}svg{display:block}</style></head><body>
<script>
// Round 5: R4B (target lock) at R4A's size and centring, plus a LIVE variant whose stars are real subsystems.
// state = nominal | warn | crit. Star roles (live): TL memory sync · TR Mac Mini · BL tests · BR pipeline/agents ·
// core = overall verdict. The lock brackets are the alert: hidden when nominal, amber for warnings, red for critical.
const ICON = { pts: [[262,772],[262,262],[512,560],[762,262],[762,772]], core: 2, star: 44, coreR: 68, orbit: 118, line: 26 };
const C = { green:'#5ae88a', amber:'#e5ab36', orange:'#f4702e', red:'#ff4a3d' };
const q = new URLSearchParams(location.search), state = q.get('state') || 'static';
// R4A geometry, nudged down so the M's optical centre sits at the icon's centre
const P = ICON.pts.map(([x,y]) => [x, y + 0]);
const [cx,cy] = P[ICON.core];
const STAR = { static:[C.green,C.green,C.green,C.green], nominal:[C.green,C.green,C.green,C.green],
               warn:[C.green,C.amber,C.green,C.green], crit:[C.green,C.green,C.red,C.green] }[state]; // BL, TL, TR, BR order below
const order = [0,1,3,4]; // indices of outer stars in ICON.pts: BL, TL, TR, BR
const coreFill = { static:'url(#mcore)', nominal:'url(#mcore)', warn:'url(#acore)', crit:'url(#rcore)' }[state];
const lockCol = { static:C.orange, nominal:null, warn:C.amber, crit:C.red }[state];
let st = 7; const r = () => (st = (st*16807)%2147483647)/2147483647;
const stars = Array.from({length:38},()=>`<circle cx="${40+r()*944}" cy="${40+r()*944}" r="${2+r()*3.5}" fill="#cfd6e6" opacity="${.18+r()*.4}"/>`).join('');
const b = ICON.orbit + 58, L = 54, w = 16;
const lock = lockCol ? [[-1,-1],[1,-1],[1,1],[-1,1]].map(([x,y])=>`<path d="M${cx+x*b} ${cy+y*(b-L)} V${cy+y*b} H${cx+x*(b-L)}" stroke="${lockCol}" stroke-width="${w}" fill="none" stroke-linecap="square" filter="url(#ml)"/>`).join('') : '';
document.body.innerHTML = `
<svg width="1024" height="1024" viewBox="0 0 1024 1024">
 <defs>
  <filter id="ml" x="-20%" y="-20%" width="140%" height="140%"><feGaussianBlur stdDeviation="5" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
  <filter id="mn" x="-100%" y="-100%" width="300%" height="300%"><feGaussianBlur stdDeviation="8" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
  <filter id="mc" x="-200%" y="-200%" width="500%" height="500%"><feGaussianBlur stdDeviation="18" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
  <radialGradient id="mcore" cx="45%" cy="42%" r="60%"><stop offset="0" stop-color="#c8f5d6"/><stop offset=".55" stop-color="#6ff0a0"/><stop offset="1" stop-color="#5ae88a"/></radialGradient>
  <radialGradient id="acore" cx="45%" cy="42%" r="60%"><stop offset="0" stop-color="#fbe7b8"/><stop offset=".55" stop-color="#f0c060"/><stop offset="1" stop-color="#e5ab36"/></radialGradient>
  <radialGradient id="rcore" cx="45%" cy="42%" r="60%"><stop offset="0" stop-color="#ffd0cb"/><stop offset=".55" stop-color="#ff7a6e"/><stop offset="1" stop-color="#ff4a3d"/></radialGradient>
  <pattern id="raster" width="12" height="12" patternUnits="userSpaceOnUse"><rect width="12" height="4" fill="#ffffff" opacity=".035"/></pattern>
 </defs>
 <rect width="1024" height="1024" fill="#000000"/>
 ${stars}
 <polyline points="${P.map(p=>p.join(',')).join(' ')}" fill="none" stroke="${C.amber}" stroke-width="${ICON.line}" stroke-linejoin="round" stroke-linecap="round" filter="url(#ml)"/>
 <circle cx="${cx}" cy="${cy}" r="${ICON.orbit}" fill="none" stroke="${C.orange}" stroke-width="10" stroke-dasharray="3 24" stroke-linecap="round" opacity=".9"/>
 <g filter="url(#mn)">${order.map((idx,k)=>`<circle cx="${P[idx][0]}" cy="${P[idx][1]}" r="${ICON.star}" fill="${STAR[k]}"/>`).join('')}</g>
 <circle cx="${cx}" cy="${cy}" r="${ICON.coreR}" fill="${coreFill}" filter="url(#mc)"/>
 ${lock}
</svg>`;
</script></body></html>
