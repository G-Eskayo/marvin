<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 980" font-family="Helvetica, Arial, sans-serif" font-size="15">
  <rect width="1200" height="980" fill="#0b0f14"/>
  <style>
    .t{fill:#e6f1ff}.m{fill:#8aa4bf}.h{fill:#5fe3ff;font-weight:bold;font-size:22px}
    .lbl{fill:#e6f1ff;font-size:14px}.ln{stroke:#8aa4bf;stroke-width:1.2;fill:none}
    .glass{fill:#5fe3ff;fill-opacity:.10;stroke:#5fe3ff;stroke-width:2}
    .lcd{fill:#1d2a36;stroke:#e6f1ff;stroke-width:2}
    .led{fill:#ffcf6b}
    .leg{fill:#59636e;stroke:#a9b4bf;stroke-width:1.5}
    .ui{stroke:#5fe3ff;stroke-width:2;fill:none}
  </style>

  <text x="40" y="44" class="h">MARVIN Surface: build sketches (not to scale)</text>
  <text x="40" y="68" class="m">Transparent LCD in front of an edge-lit acrylic light guide, held up by legs at each end. 2026-10-21 research pass.</text>

  <!-- ================= V1 ================= -->
  <text x="40" y="112" class="h">V1: proof of concept, flat (about $450–$1,100, 1–3 weekends)</text>

  <!-- front view -->
  <text x="60" y="142" class="m">Front view</text>
  <rect x="80" y="160" width="20" height="250" class="leg"/>
  <rect x="520" y="160" width="20" height="250" class="leg"/>
  <rect x="60" y="405" width="60" height="12" class="leg"/>
  <rect x="500" y="405" width="60" height="12" class="leg"/>
  <rect x="100" y="170" width="420" height="200" class="glass"/>
  <rect x="140" y="190" width="340" height="160" class="lcd"/>
  <circle cx="230" cy="270" r="40" class="ui"/><circle cx="230" cy="270" r="26" class="ui" stroke-dasharray="6 5"/>
  <line x1="300" y1="230" x2="450" y2="230" class="ui"/><line x1="300" y1="260" x2="420" y2="260" class="ui"/><line x1="300" y1="290" x2="440" y2="290" class="ui"/>
  <rect x="100" y="164" width="420" height="6" class="led"/>
  <rect x="100" y="370" width="420" height="6" class="led"/>
  <rect x="134" y="184" width="352" height="172" fill="none" stroke="#ff8a5f" stroke-width="2" stroke-dasharray="8 5"/>

  <!-- labels V1 front -->
  <line x1="480" y1="167" x2="610" y2="150" class="ln"/><text x="615" y="154" class="lbl">CORRECTED: LEDs go in the SHORT ends (left/right), not here</text>
  <line x1="470" y1="205" x2="610" y2="182" class="ln"/><text x="615" y="186" class="lbl">21.5" or 32" transparent LCD + HDMI board (showcase kit)</text>
  <line x1="505" y1="230" x2="610" y2="214" class="ln"/><text x="615" y="218" class="lbl">6 mm cast-acrylic light-guide plate (laser dots behind display)</text>
  <line x1="486" y1="320" x2="610" y2="246" class="ln"/><text x="615" y="250" class="lbl">IR touch frame, flat, over the display only (orange dashes)</text>
  <line x1="540" y1="330" x2="610" y2="278" class="ln"/><text x="615" y="282" class="lbl">Legs: 2020 aluminium extrusion + 3D-printed slotted clamps + gaskets</text>
  <line x1="480" y1="374" x2="610" y2="310" class="ln"/><text x="615" y="314" class="lbl">Short-edge light, both ends, graded dots = even glow (see §0.7)</text>
  <text x="615" y="346" class="lbl">Brain: ESP32 running WLED + VEML7700 light sensor.</text>
  <text x="615" y="366" class="lbl">MARVIN sets glow brightness and colour from room light + screen content.</text>
  <text x="615" y="386" class="lbl">Video: M4 Mac mini over HDMI. Touch: USB (UPDD on macOS, native on Linux).</text>

  <!-- side view V1 -->
  <text x="60" y="456" class="m">Side view (layer stack, viewer on the left)</text>
  <text x="70" y="510" class="lbl">viewer →</text>
  <rect x="160" y="475" width="6" height="90" fill="#ff8a5f"/>
  <rect x="180" y="480" width="8" height="80" class="lcd"/>
  <rect x="200" y="470" width="14" height="100" class="glass"/>
  <rect x="200" y="462" width="14" height="6" class="led"/><rect x="200" y="572" width="14" height="6" class="led"/>
  <text x="240" y="490" class="lbl">IR frame → transparent LCD → light-guide plate (glows forward) → room behind (seen through, about 10–15%)</text>
  <text x="240" y="514" class="m">Glow ON: bright pixels glow, black UI = dark smoked glass.</text>
  <text x="240" y="536" class="m">Glow OFF: the room behind shows faintly through bright areas.</text>
  <text x="240" y="558" class="m">Unpowered: depends on the panel (normally-black vs normally-white). Ask the seller.</text>

  <!-- ================= V3 ================= -->
  <line x1="40" y1="600" x2="1160" y2="600" stroke="#24313e" stroke-width="2"/>
  <text x="40" y="640" class="h">V3: the dream, wide curved sheet (about $5k–$12k+, 3–6+ months)</text>

  <!-- top view arc -->
  <text x="60" y="672" class="m">Top view (looking down; displays sit just behind the glass, Gil in front)</text>
  <path d="M80 760 Q 340 650 600 760" fill="none" stroke="#5fe3ff" stroke-opacity=".8" stroke-width="8"/>
  <path d="M80 752 Q 340 642 600 752" fill="none" stroke="#ffcf6b" stroke-width="2" stroke-dasharray="3 4"/>
  <rect x="60" y="748" width="34" height="26" class="leg"/>
  <rect x="586" y="748" width="34" height="26" class="leg"/>
  <line x1="160" y1="722" x2="265" y2="694" stroke="#e6f1ff" stroke-width="5"/>
  <line x1="285" y1="690" x2="395" y2="690" stroke="#e6f1ff" stroke-width="5"/>
  <line x1="415" y1="694" x2="520" y2="722" stroke="#e6f1ff" stroke-width="5"/>
  <circle cx="340" cy="880" r="10" fill="#5fe3ff"/><text x="358" y="885" class="lbl">Gil</text>
  <line x1="340" y1="870" x2="340" y2="714" stroke="#5fe3ff" stroke-dasharray="4 6"/>

  <line x1="560" y1="740" x2="650" y2="676" class="ln"/><text x="655" y="680" class="lbl">1.8–2 m arc: thermoformed acrylic or bent laminated glass</text>
  <text x="655" y="700" class="m">Cold-bent cast acrylic only to about 330x thickness (6 mm → R ≥ 2 m)</text>
  <line x1="395" y1="690" x2="650" y2="730" class="ln"/><text x="655" y="734" class="lbl">2–3 flat transparent LCDs angled along the arc</text>
  <text x="655" y="754" class="m">or a transparent OLED centrepiece, or a bent Xeneon Flex 45" (opaque)</text>
  <line x1="500" y1="712" x2="650" y2="786" class="ln"/><text x="655" y="790" class="lbl">V3: LEDs in the legs at the SHORT ends only (see v3-design)</text>
  <line x1="620" y1="768" x2="650" y2="822" class="ln"/><text x="655" y="826" class="lbl">End legs: CNC aluminium, full-height slotted clamps</text>
  <text x="655" y="856" class="lbl">Curved PCAP foil laminated behind the face</text>
  <text x="655" y="876" class="m">The only touch that follows a curve (IR frames need flat)</text>
  <text x="655" y="906" class="lbl">Flat 32" panel behind an R 2 m arc: about 3 cm edge gap</text>

  <text x="40" y="950" class="m">V2 sits between the two: one 32" vendor transparent LCD set flat into a 1.5 m cold-bent acrylic sheet, PCAP foil over the display, CNC legs (about $1.8k–$3.5k).</text>
</svg>
