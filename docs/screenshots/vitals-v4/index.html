<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Vitals v4 Prototypes</title>
<link rel="stylesheet" href="fonts.css"><link rel="stylesheet" href="common.css">
<style>
nav{position:absolute;top:0;left:0;right:0;height:52px;display:flex;align-items:center;gap:8px;padding:0 16px;border-bottom:1px solid var(--line);background:var(--dash);z-index:2}
nav .mk{font:800 18px 'Saira Condensed';letter-spacing:.3em;margin-right:12px}
nav button{min-height:44px;padding:0 16px;background:none;border:1px solid var(--line);color:var(--dim);font:600 14px 'Saira Condensed';letter-spacing:.25em;text-transform:uppercase;cursor:pointer}
nav button[aria-pressed=true]{border-color:var(--amber);color:var(--amber);box-shadow:0 0 calc(12px*var(--glow)) #f0b32a55}
iframe{position:absolute;top:52px;left:0;right:0;bottom:0;width:100%;height:calc(100% - 52px);border:0}
@media (max-width:600px){nav .mk{display:none}nav button{padding:0 10px;letter-spacing:.12em}}
</style></head><body>
<nav role="group" aria-label="Vitals view"><span class="mk">VITALS v4</span>
<button data-v="network">Network</button><button data-v="tunnel">Tunnel</button><button data-v="planets">Planets</button></nav>
<iframe id="f" title="Vitals view"></iframe>
<script>
const f = document.getElementById('f'), bs = [...document.querySelectorAll('nav button')];
function go(v) { bs.forEach(b => b.setAttribute('aria-pressed', b.dataset.v === v)); f.src = v + '.html' + location.hash; try { localStorage.setItem('vitals-v4-view', v); } catch (e) {} }
bs.forEach(b => b.onclick = () => go(b.dataset.v));
let v = 'network'; try { v = new URLSearchParams(location.search).get('v') || localStorage.getItem('vitals-v4-view') || v; } catch (e) {}
go(v);
</script>
</body></html>
