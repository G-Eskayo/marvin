<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Vitals Planets</title>
<link rel="stylesheet" href="fonts.css"><link rel="stylesheet" href="common.css">
</head><body>
<canvas class="stage" id="cv"></canvas>
<div class="hud"><div class="eyebrow">Vitals · planets</div><div class="big" id="big"></div><div class="sub" id="sub"></div></div>
<div class="legend">one planet per registered machine<br>moons = its jobs and callers · faster = busier this hour<br>arcs = work one machine sent to another (job logs)<br>beams = GitHub calls and model launches this hour<br>tap a planet, then a moon</div>
<div id="ctl"></div>
<script src="data.js"></script><script src="common.js"></script>
<script>
const { D, RM, COL, byId, mById, showNode, show, scrubber, camera, fitCanvas, glow, narrow, nodeLabel } = V4;
const ms = D.machines;
const P = {};
ms.forEach((m, i) => { const a = 2 * Math.PI * i / ms.length + Math.PI / 2; P[m.id] = [Math.cos(a) * 280, 0, Math.sin(a) * 280]; });
const gh = byId.github; if (gh) P.github = [0, -300, 0];
const models = D.nodes.filter(n => n.type === 'external' && n.id !== 'github');
models.forEach((n, i) => P[n.id] = [(i - (models.length - 1) / 2) * 90, 300, 0]);
// moons: each machine's parts. Orbit ring by kind (launches inside, services, then callers outside).
const tier = { 'launch-kind': 0, service: 1, 'caller-group': 2 };
const moons = {};
D.nodes.forEach(n => { if (n.machine && tier[n.type] != null) (moons[n.machine] = moons[n.machine] || []).push(n); });
Object.values(moons).forEach(arr => { arr.sort((a, b) => tier[a.type] - tier[b.type] || a.id.localeCompare(b.id)); const cnt = [0, 0, 0], tot = [0, 0, 0]; arr.forEach(n => tot[tier[n.type]]++); arr.forEach(n => { const t = tier[n.type]; n._orbit = 62 + t * 34; n._phase = 2 * Math.PI * (cnt[t]++) / tot[t] + t; }); });
// per-hour traffic: lanes for moons; GitHub beams from 'calls from <machine>' lanes; model beams from launch lanes
const day0 = D.window.end + 1 - 86400, H0 = D.window.hours - 24;
const laneH = {}; D.lanes.forEach(l => { (laneH[l.node] = laneH[l.node] || Array(24).fill(0)); if (l.unit !== 'cost usd') l.v.slice(H0).forEach((v, i) => laneH[l.node][i] += v); });
const ghFrom = {}; D.lanes.filter(l => l.node === 'github' && l.unit.startsWith('calls from ')).forEach(l => ghFrom[l.unit.slice(11)] = l.v.slice(H0));
const modelFrom = {}; D.edges.filter(e => e.kind === 'model').forEach(e => { const m = byId[e.from].machine; const k = m + '>' + e.to; modelFrom[k] = (modelFrom[k] || Array(24).fill(0)).map((x, i) => x + e.hours24[i]); });
const series = Array.from({ length: 24 }, (_, i) => Object.values(ghFrom).reduce((s, a) => s + a[i], 0) + Object.values(modelFrom).reduce((s, a) => s + a[i], 0) + D.arcs.reduce((s, a) => s + a.hours24[i], 0));
const marks = D.events.filter(e => e.t >= day0).map(e => ({ i: Math.floor((e.t - day0) / 3600), kind: e.kind }));
let hour = 23;
scrubber(document.getElementById('ctl'), series, marks, day0, i => hour = i, 'Hour', V4.idxOf(day0, 24));

const read = ms.filter(m => m.read).length;
document.getElementById('big').innerHTML = ms.map(m => `<span class=${byId[m.id].health === 'red' ? 'r' : byId[m.id].health === 'yellow' ? 'y' : byId[m.id].health === 'green' ? 'g' : ''} style="${byId[m.id].health === 'grey' ? 'color:var(--dim)' : ''}">${m.label}</span>`).join(' · ');
document.getElementById('sub').textContent = `${read} of ${ms.length} machines read · ${D.arcs.length} kinds of cross-machine work · colour = the machine's own worst check`;

const cv = document.getElementById('cv');
let focus = null, sel = null, proj = {};
const cam = camera(cv, { yaw: 0.2, pitch: 0.42, dist: 1200, spin: 0.00012, onTap: tap });
function tap(x, y) {
  let best = null, bd = 30;
  Object.entries(proj).forEach(([id, p]) => { const d = Math.hypot(p.x - x, p.y - y) - (p.r || 0) * 0.6; if (d < bd && (!focus || id === focus || (byId[id] && byId[id].machine === focus) || !byId[id].machine)) { bd = d; best = id; } });
  if (!best) { focus = null; sel = null; V4.panel.hidden = true; return; }
  const n = byId[best];
  if (n.type === 'machine') { focus = best; sel = best; const m = mById[best]; showNode(n, Object.assign({ 'read': m.read ? m.note : m.note, 'accepts': (m.accepts || []).join(', '), 'moons (parts)': (moons[best] || []).length, 'events 24h (all its parts)': mload[best] }, m.profile, { 'cross-machine work out (runs kept)': Object.fromEntries(D.arcs.filter(a => a.from === best).map(a => [`${nodeLabel(byId[a.via])} → ${mById[a.to].label}`, a.runs])), 'cross-machine work in (runs kept)': Object.fromEntries(D.arcs.filter(a => a.to === best).map(a => [`${nodeLabel(byId[a.via])} from ${mById[a.from].label}`, a.runs])) })); }
  else { sel = best; showNode(n, { 'this hour': (laneH[best] || [])[hour] || 0 }); }
}
addEventListener('vitals:close', () => { focus = null; sel = null; });
const mload = {}; ms.forEach(m => mload[m.id] = (moons[m.id] || []).reduce((s, n) => s + n.load24, 0));
const size = id => Math.log10(1 + (mload[id] || 0));
let T = 0, last = performance.now();
function frame(now) {
  const dt = Math.min(50, now - last); last = now; T += RM ? 0 : dt; cam.tick(dt);
  const { c, W, H } = fitCanvas(cv); c.clearRect(0, 0, W, H); proj = {};
  const pr = (p) => cam.project(p[0], p[1], p[2], W, H);
  // GitHub + model bodies
  [gh, ...models].filter(Boolean).forEach(n => {
    const q = pr(P[n.id]), r = (n.id === 'github' ? 22 : 9) * q.f, col = COL[n.health] || COL.grey; proj[n.id] = Object.assign(q, { r });
    c.globalAlpha = focus ? .35 : 1; glow(c, col, .8); c.strokeStyle = col; c.lineWidth = 1.4;
    c.beginPath(); c.arc(q.x, q.y, r, 0, 7); c.stroke(); c.beginPath(); c.ellipse(q.x, q.y, r, r * .3, 0, 0, 7); c.stroke(); c.shadowBlur = 0;
    c.fillStyle = col; c.font = "11px 'Share Tech Mono'"; c.textAlign = 'center'; if (n.id === 'github' || !narrow()) c.fillText(n.label, q.x, q.y - r - 6);
  });
  // beams: machine -> GitHub, machine -> model, particle count = calls this hour
  const beam = (a, b, v, col, curve) => {
    if (!v) return; const A = pr(a), Bq = pr(b), mx = (A.x + Bq.x) / 2, my = (A.y + Bq.y) / 2 - curve;
    c.strokeStyle = col; c.globalAlpha = .25 + Math.min(.5, Math.log10(1 + v) / 8); c.lineWidth = .6 + Math.log10(1 + v);
    c.beginPath(); c.moveTo(A.x, A.y); c.quadraticCurveTo(mx, my, Bq.x, Bq.y); c.stroke();
    const k = Math.min(16, Math.ceil(Math.log2(1 + v))); c.fillStyle = col; glow(c, col, .6);
    for (let j = 0; j < k; j++) { const u = RM ? (j + .5) / k : ((T * 0.0002 * (1 + Math.log10(1 + v))) + j / k) % 1; const x = (1 - u) * (1 - u) * A.x + 2 * (1 - u) * u * mx + u * u * Bq.x, y = (1 - u) * (1 - u) * A.y + 2 * (1 - u) * u * my + u * u * Bq.y; c.beginPath(); c.arc(x, y, 1.8, 0, 7); c.fill(); }
    c.shadowBlur = 0; c.globalAlpha = 1;
  };
  ms.forEach(m => { if (gh && ghFrom[m.id]) beam(P[m.id], P.github, ghFrom[m.id][hour], ghFrom[m.id][hour] > 1000 ? COL.red : COL.amber, 40); });
  Object.entries(modelFrom).forEach(([k, arr]) => { const [mid, mod] = k.split('>'); if (P[mid] && P[mod]) beam(P[mid], P[mod], arr[hour], COL.moon, -30); });
  // cross-machine arcs (always drawn faintly, particles when that hour had runs)
  D.arcs.forEach((a, j) => {
    const A = pr(P[a.from]), Bq = pr(P[a.to]); if (!A || !Bq) return; const lift = 90 + j * 18;
    const mx = (A.x + Bq.x) / 2, my = (A.y + Bq.y) / 2 - lift; const v = a.hours24[hour];
    c.strokeStyle = COL.green; c.globalAlpha = v ? .8 : .22; c.lineWidth = v ? 1.6 : .8; c.setLineDash(mById[a.to].read ? [] : [4, 4]);
    c.beginPath(); c.moveTo(A.x, A.y); c.quadraticCurveTo(mx, my, Bq.x, Bq.y); c.stroke(); c.setLineDash([]);
    if (!narrow() || focus) { c.fillStyle = COL.green; c.font = "10px 'Share Tech Mono'"; c.textAlign = 'center'; c.fillText(`${byId[a.via].label} · ${a.runs} runs${v ? ` · ${v} this hour` : ''}`, mx, (A.y + Bq.y) / 2 - lift / 2 - 4); }
    if (v) { c.fillStyle = COL.green; glow(c, COL.green, 1); const u = RM ? .5 : (T * 0.0004) % 1; c.beginPath(); c.arc((1 - u) * (1 - u) * A.x + 2 * (1 - u) * u * mx + u * u * Bq.x, (1 - u) * (1 - u) * A.y + 2 * (1 - u) * u * my + u * u * Bq.y, 3, 0, 7); c.fill(); c.shadowBlur = 0; }
    c.globalAlpha = 1;
  });
  // planets + moons
  const busiest = {}; ms.forEach(m => busiest[m.id] = new Set((moons[m.id] || []).slice().sort((a, b) => ((laneH[b.id] || [])[hour] || 0) - ((laneH[a.id] || [])[hour] || 0)).slice(0, narrow() ? 3 : 6).map(n => n.id)));
  ms.forEach(m => {
    const n = byId[m.id], q = pr(P[m.id]), col = COL[n.health] || COL.grey;
    const R = (30 + 11 * size(m.id)) * q.f * (focus === m.id ? 1.25 : 1); proj[m.id] = Object.assign(q, { r: R });
    const dim = focus && focus !== m.id; c.globalAlpha = dim ? .2 : 1;
    // wireframe globe, glass style
    c.strokeStyle = col; c.lineWidth = 1.3; glow(c, col, 1); c.setLineDash(m.read ? [] : [4, 4]);
    c.beginPath(); c.arc(q.x, q.y, R, 0, 7); c.stroke(); c.shadowBlur = 0; c.lineWidth = .6; c.globalAlpha *= .6;
    for (let k = 1; k < 4; k++) { c.beginPath(); c.ellipse(q.x, q.y, R, R * Math.abs(Math.sin(cam.pitch)) * k / 4 + .1, 0, 0, 7); c.stroke(); c.beginPath(); c.ellipse(q.x, q.y, R * Math.abs(Math.cos(cam.yaw * 1 + k * 0.8)), R, 0, 0, 7); c.stroke(); }
    c.setLineDash([]); c.globalAlpha = dim ? .2 : 1;
    c.fillStyle = COL.amber; c.font = "600 16px 'Saira Condensed'"; c.textAlign = 'center'; c.fillText(m.label.toUpperCase(), q.x, q.y + R + 18);
    c.fillStyle = col; c.font = "11px 'Share Tech Mono'"; c.fillText(m.read ? `${(moons[m.id] || []).length} parts · ${mload[m.id].toLocaleString()} events 24h` : 'not read', q.x, q.y + R + 32);
    // orbits
    (moons[m.id] || []).forEach(mn => {
      const hv = (laneH[mn.id] || [])[hour] || 0, speed = 0.00006 * (0.4 + Math.log10(1 + hv));
      const ang = mn._phase + T * speed, orb = mn._orbit * (focus === m.id ? 1.6 : 1);
      const tilt = focus === m.id ? 0.85 : 0.18;   // focused: open the orbits toward you so each moon can be read
      const mp = [P[m.id][0] + Math.cos(ang) * orb, P[m.id][1] + Math.sin(ang) * orb * tilt, P[m.id][2] + Math.sin(ang) * orb * (1 - tilt * .8)];
      const mq = pr(mp), r = (1.6 + 1.4 * Math.log10(1 + hv)) * mq.f * (focus === m.id ? 1.4 : 1), mc = COL[mn.health] || COL.grey; proj[mn.id] = Object.assign(mq, { r });
      c.globalAlpha = dim ? .12 : 1; c.fillStyle = mc; glow(c, mc, mn.health === 'red' ? 1.3 : .5);
      c.beginPath(); c.arc(mq.x, mq.y, Math.max(1.4, r), 0, 7); c.fill(); c.shadowBlur = 0;
      if (sel === mn.id) { c.strokeStyle = COL.amber; c.beginPath(); c.arc(mq.x, mq.y, r + 7, 0, 7); c.stroke(); }
      if (focus === m.id && (mn.health !== 'green' || busiest[m.id].has(mn.id) || sel === mn.id)) { c.fillStyle = mc; c.font = "10px 'Share Tech Mono'"; c.textAlign = 'left'; c.fillText(mn.label + (hv ? ` ${hv}` : ''), mq.x + r + 4, mq.y + 3); }
    });
    c.globalAlpha = 1;
  });
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);
if (V4.hash.sel) setTimeout(() => { const p = proj[V4.hash.sel]; if (p) tap(p.x, p.y); }, 120);
</script>
</body></html>
