<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Vitals Time Tunnel</title>
<link rel="stylesheet" href="fonts.css"><link rel="stylesheet" href="common.css">
</head><body>
<canvas class="stage" id="cv"></canvas>
<div class="hud"><div class="eyebrow">Vitals · time tunnel</div><div class="big" id="big"></div><div class="sub" id="sub"></div></div>
<div class="legend">one lane per part, grouped by machine<br>nearest ring = the hour you picked · deeper = older<br>brightness = that hour's count vs the lane's own peak<br><b style="color:var(--red)">wall</b> = storm (≥6× the lane's median hour, ≥100)<br><b style="color:var(--orange)">ring</b> = a ticket planned again<br>drag sideways to turn · tap a cell for numbers</div>
<div id="ctl"></div>
<script src="data.js"></script><script src="common.js"></script>
<script>
const { D, RM, COL, byId, mById, show, scrubber, fitCanvas, glow, narrow, fmtT, fmtH } = V4;
const HRS = D.window.hours, B = D.window.bucket_s, start = D.window.end + 1 - HRS * B;
// Lanes: every lane the generator found, except sinks (GitHub, models: their traffic is already in the callers' lanes)
// and cost (shown in the numbers). Grouped by machine, busiest first.
const lanes = D.lanes.filter(l => l.unit !== 'cost usd' && (byId[l.node] || {}).type !== 'external')
  .map(l => Object.assign({}, l, { total: l.v.reduce((a, b) => a + b, 0), peak: Math.max(...l.v) }))
  .sort((a, b) => (a.machine || '').localeCompare(b.machine || '') || b.total - a.total);
const cost = Object.fromEntries(D.lanes.filter(l => l.unit === 'cost usd').map(l => [l.node, l.v]));
// angles: each machine a sector sized by its lane count, with a gap between machines
const machinesHere = [...new Set(lanes.map(l => l.machine))];
const GAP = 0.08, per = (2 * Math.PI - GAP * machinesHere.length) / lanes.length;
let a = -Math.PI / 2; const sectors = {};
lanes.forEach((l, i) => { if (i === 0 || lanes[i - 1].machine !== l.machine) { a += GAP; sectors[l.machine] = { a0: a }; } l.a0 = a; l.a1 = a + per; a += per; sectors[l.machine].a1 = a; });
const storms = D.events.filter(e => e.kind === 'storm'), loops = D.events.filter(e => e.kind === 'loop');
const stormAt = {}; storms.forEach(e => (stormAt[e.lane + '@' + e.i] = e));
const loopsAt = {}; loops.forEach(e => (loopsAt[e.lane + '@' + e.i] = loopsAt[e.lane + '@' + e.i] || []).push(e));

const total = Array.from({ length: HRS }, (_, i) => lanes.reduce((s, l) => s + l.v[i], 0));
const marks = D.events.map(e => ({ i: e.i, kind: e.kind }));
let at = HRS - 1;
scrubber(document.getElementById('ctl'), total, marks, start, i => { at = i; dirty = true; }, 'Nearest hour', V4.idxOf(start, HRS));

const nStorm = new Set(storms.filter(e => e.t >= D.window.end - 86400).map(e => e.lane)).size;
const nLoopT = new Set(loops.filter(e => e.t >= D.window.end - 86400).map(e => e.ticket)).size;
document.getElementById('big').innerHTML = `<span class=r>${nStorm} storm lanes</span> <span class=y>${nLoopT} looping tickets</span>`;
document.getElementById('sub').textContent = `last 24h · ${lanes.length} lanes on ${machinesHere.length} machines · ${Math.round(HRS / 24)} days to scrub`;

const cv = document.getElementById('cv');
let roll = 0, dirty = true, fins = [], px = null, moved = 0;
cv.addEventListener('pointerdown', e => { px = e.clientX; moved = 0; cv.setPointerCapture(e.pointerId); });
cv.addEventListener('pointermove', e => { if (px == null) return; roll += (e.clientX - px) * 0.006; moved += Math.abs(e.clientX - px); px = e.clientX; dirty = true; });
cv.addEventListener('pointerup', e => { px = null; if (moved < 6) tap(e.offsetX, e.offsetY); });
addEventListener('resize', () => dirty = true);
const DEPTH = () => narrow() ? 48 : 72;  // hours visible down the tunnel
function tap(x, y) {
  let best = null, bd = 24;
  fins.forEach(f => { const d = Math.hypot(f.x - x, f.y - y); if (d < bd) { bd = d; best = f; } });
  if (!best) { V4.panel.hidden = true; return; }
  const l = best.l, i = best.i, n = byId[l.node] || {};
  const st = stormAt[l.id + '@' + i], lp = loopsAt[l.id + '@' + i] || [];
  const last24 = l.v.slice(Math.max(0, at - 23), at + 1).reduce((a, b) => a + b, 0);
  const obj = { part: V4.nodeLabel(n), unit: l.unit, hour: fmtT(start + i * B), [`${l.unit} that hour`]: l.v[i], 'failed that hour': l.fail[i],
    'lane median hour (non-zero)': median(l.v.filter(Boolean)), 'lane peak hour': l.peak, '24h up to picked hour': last24, [`${Math.round(HRS / 24)}-day total`]: l.total };
  if (cost[l.node]) obj['cost usd that hour'] = cost[l.node][i].toFixed(2);
  if (st) obj['storm'] = st.why;
  if (lp.length) obj['re-plans that hour'] = Object.fromEntries(lp.map(e => [e.ticket, `plan #${e.nth_plan}`]));
  show(V4.nodeLabel(n), st ? 'red' : lp.length ? 'yellow' : n.health, obj, n.why && n.why.length ? `<ul class=why><li>${V4.esc(n.why[0])}</li></ul>` : '');
}
function median(a) { if (!a.length) return 0; a = a.slice().sort((x, y) => x - y); return a[Math.floor(a.length / 2)]; }

let T = 0, last = performance.now();
function frame(now) {
  const dt = now - last; last = now; T += dt;
  const flow = RM ? 0 : (T / 4000) % 1;                // rings drift toward you: time flowing, not data
  if (!dirty) return requestAnimationFrame(frame);
  dirty = false;
  const { c, W, H } = fitCanvas(cv);
  c.clearRect(0, 0, W, H);
  const cx = W / 2, cy = H * 0.5, R = 300, z0 = 220, dz = narrow() ? 46 : 40, F = 0.46 * Math.min(W, H * 1.2) * z0 / R;
  const P = (ang, r, z) => { const s = F / z; return [cx + Math.cos(ang + roll) * r * s, cy + Math.sin(ang + roll) * r * s, s]; };
  const N = DEPTH(); fins = [];
  const labelled = {};   // one label per storming lane: its biggest hour in view
  lanes.forEach(l => { let bi = -1, bv = 0; for (let k = 0; k < N; k++) { const i = at - k, e = stormAt[l.id + '@' + i]; if (e && e.value > bv) { bv = e.value; bi = i; } } if (bi >= 0) labelled[l.id] = bi; });
  // far to near
  for (let k = N - 1; k >= 0; k--) {
    const i = at - k; if (i < 0) continue;
    const z = z0 + (k + 1 - flow * 0) * dz;
    const tHour = start + i * B, d = new Date(tHour * 1000);
    const fade = 1 - k / N;
    // time ring: brighter at local midnight, labelled
    const midnight = d.getHours() === 0, six = d.getHours() % 6 === 0;
    if (six) {
      c.beginPath(); for (let q = 0; q <= 64; q++) { const p = P(q / 64 * 2 * Math.PI, R, z); q ? c.lineTo(p[0], p[1]) : c.moveTo(p[0], p[1]); }
      c.strokeStyle = COL.line; c.globalAlpha = (midnight ? .7 : .25) * fade; c.lineWidth = midnight ? 1.2 : .6; c.stroke();
      if (midnight || k < 30) { const p = P(-Math.PI / 2 - roll, R + 14, z); c.fillStyle = COL.dim; c.font = "10px 'Share Tech Mono'"; c.textAlign = 'center'; c.globalAlpha = fade; c.fillText(midnight ? d.toLocaleDateString([], { weekday: 'short', day: 'numeric' }) : fmtH(tHour), p[0], p[1]); }
    }
    // lane cells on the tunnel wall: brightness = that hour's count vs the lane's own peak
    lanes.forEach(l => {
      const v = l.v[i]; if (!v) return;
      const k1 = Math.log1p(v) / Math.log1p(l.peak || 1), st = stormAt[l.id + '@' + i];
      const za = z, zb = z + dz * 0.92;
      const p0 = P(l.a0, R, za), p1 = P(l.a1, R, za), p2 = P(l.a1, R, zb), p3 = P(l.a0, R, zb);
      c.globalAlpha = (0.05 + 0.6 * k1) * Math.max(.25, fade);
      c.fillStyle = st ? COL.red : l.fail[i] ? COL.orange : COL.amber;
      c.beginPath(); c.moveTo(p0[0], p0[1]); c.lineTo(p1[0], p1[1]); c.lineTo(p2[0], p2[1]); c.lineTo(p3[0], p3[1]); c.closePath(); c.fill();
      if (k1 > .6) { c.globalAlpha *= .9; c.strokeStyle = c.fillStyle; c.lineWidth = .8; c.stroke(); }
      const m = P((l.a0 + l.a1) / 2, R, (za + zb) / 2); fins.push({ x: m[0], y: m[1], l, i, k });
    });
    // storm walls: a translucent wall across the lane, full depth of the hour
    lanes.forEach(l => {
      const st = stormAt[l.id + '@' + i]; if (!st) return;
      const a0 = P(l.a0 - per * 2, R, z), a1 = P(l.a1 + per * 2, R, z), b1 = P(l.a1 + per * 2, R * 0.35, z), b0 = P(l.a0 - per * 2, R * 0.35, z);
      c.globalAlpha = .16 * Math.max(.3, fade); c.fillStyle = COL.red;
      c.beginPath(); c.moveTo(a0[0], a0[1]); c.lineTo(a1[0], a1[1]); c.lineTo(b1[0], b1[1]); c.lineTo(b0[0], b0[1]); c.closePath(); c.fill();
      if (labelled[l.id] === i) { const p = P((l.a0 + l.a1) / 2, R * 0.33, z); c.globalAlpha = fade; c.fillStyle = COL.red; c.font = "11px 'Share Tech Mono'"; c.textAlign = 'center'; c.fillText(`${st.value.toLocaleString()} ${l.unit.replace('GitHub ', 'gh ')}/h`, p[0], p[1]); }
    });
    // loop rings
    lanes.forEach(l => {
      (loopsAt[l.id + '@' + i] || []).forEach((e, j) => {
        const p = P((l.a0 + l.a1) / 2, R - 140 - j * 18, z), r = Math.max(2, 9 * p[2]);
        c.globalAlpha = Math.max(.25, fade); c.strokeStyle = COL.orange; c.lineWidth = 1.4; glow(c, COL.orange, .8);
        c.beginPath(); c.arc(p[0], p[1], r, 0, 7); c.stroke(); c.shadowBlur = 0;
        if (k < 14 && !narrow()) { c.fillStyle = COL.orange; c.font = "10px 'Share Tech Mono'"; c.textAlign = 'center'; c.fillText(e.ticket.split('/').pop(), p[0], p[1] - r - 3); }
        fins.push({ x: p[0], y: p[1], l, i, k });
      });
    });
  }
  // tunnel mouth: machine sectors + lane names for the biggest lanes
  c.globalAlpha = 1;
  Object.entries(sectors).forEach(([mid, s]) => {
    c.beginPath(); for (let q = 0; q <= 24; q++) { const p = P(s.a0 + (s.a1 - s.a0) * q / 24, R + 6, z0); q ? c.lineTo(p[0], p[1]) : c.moveTo(p[0], p[1]); }
    c.strokeStyle = COL.amber; c.lineWidth = 2; glow(c, COL.amber, .6); c.stroke(); c.shadowBlur = 0;
    const p = P((s.a0 + s.a1) / 2, R + 30, z0 + 40); c.fillStyle = COL.amber; c.font = "600 15px 'Saira Condensed'"; c.textAlign = 'center';
    c.fillText(((mById[mid] || {}).label || mid).toUpperCase(), Math.max(60, Math.min(W - 60, p[0])), Math.max(110, Math.min(H - 90, p[1])));
  });
  if (!narrow()) lanes.filter(l => l.total > 0).sort((a, b) => b.peak - a.peak).slice(0, 0).forEach(l => {
    const p = P((l.a0 + l.a1) / 2, R - 128, z0 + dz * 0.6); c.fillStyle = COL.dim; c.font = "10px 'Share Tech Mono'"; c.textAlign = 'center';
    c.fillText(`${(byId[l.node] || {}).label} · ${l.unit}`, p[0], p[1]);
  });
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);
</script>
</body></html>
