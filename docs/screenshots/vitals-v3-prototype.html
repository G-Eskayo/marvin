/* Tokens: #428 celestial navigation (reused) + glass rules (new). */
:root{
  --glass:#000000;          /* NEW  Surface: black = glass, it shows through */
  --dash:#0f1117;           /* #428 the Mac dashboard background (boot hands off on it) */
  --green:#54ff8a; --amber:#f0b32a; --line:#7a5a14; --orange:#ff6a1f; --red:#ff3b2f; --dim:#6b551f; --moon:#cfd6e6;
  --glow:1;                 /* NEW  glow intensity: 0 flat, 1 Gil's HUD glow (decision) */
  --u:1px;                  /* NEW  layout unit: 1 at the Surface's 1920x1080, scaled down for the Mac */
}
*{box-sizing:border-box}
html,body{margin:0;height:100%;overflow:hidden;background:var(--glass);color:var(--amber);-webkit-user-select:none;user-select:none}
body.mac{background:var(--dash)}
#app{position:absolute;left:0;right:0;top:0;bottom:var(--dock,0px)}canvas{position:absolute;inset:0;width:100%;height:100%;touch-action:none}
/* SYSTEM: the MARVIN OS dock (Surface shell). Every app sits above it; Vitals is one of them. */
#dock{position:absolute;left:0;right:0;bottom:0;height:var(--dock,0px);display:flex;align-items:center;gap:calc(8*var(--u));padding:0 calc(32*var(--u));border-top:1px solid var(--line);box-shadow:0 -1px calc(14px*var(--glow)) #f0b32a22}
#dock .mk{width:calc(40*var(--u));height:calc(40*var(--u));margin-right:calc(18*var(--u));filter:drop-shadow(0 0 calc(5px*var(--glow)) #54ff8a)}
#dock .app{display:inline-flex;align-items:center;min-height:max(44px,calc(56*var(--u)));padding:0 calc(22*var(--u));font:600 calc(19*var(--u)) 'Saira Condensed';letter-spacing:.3em;color:var(--dim);border:1px solid transparent}
#dock .app.on{color:var(--amber);border-color:var(--line);text-shadow:0 0 calc(10px*var(--glow)) #f0b32a77}
#dock .clock{margin-left:auto;font:calc(16*var(--u)) 'Share Tech Mono';color:var(--dim)}
body.mac #dock{display:none}
.raster{position:absolute;inset:0;pointer-events:none;background:repeating-linear-gradient(to bottom,#ffffff08 0 1px,#0000 1px 3px)}
.hud{position:absolute;pointer-events:none;font-family:'Share Tech Mono',ui-monospace,monospace}
.hud *{pointer-events:auto}
.tag{font:600 calc(15*var(--u)) 'Saira Condensed';letter-spacing:.35em;color:var(--dim)}
.big{font:800 calc(112*var(--u))/0.9 'Saira Condensed';letter-spacing:.04em}
.mid{font:800 calc(54*var(--u))/1 'Saira Condensed';letter-spacing:.06em}
.mono{font:calc(17*var(--u))/1.5 'Share Tech Mono'}
.red{color:var(--red);text-shadow:0 0 calc(18px*var(--glow)) #ff3b2f99}
.amb{color:var(--amber);text-shadow:0 0 calc(14px*var(--glow)) #f0b32a77}
.grn{color:var(--green);text-shadow:0 0 calc(14px*var(--glow)) #54ff8a77}
.org{color:var(--orange);text-shadow:0 0 calc(14px*var(--glow)) #ff6a1f88}
.dimt{color:var(--dim)}
/* Hairline frame with diamond nodes on its edges: no fill, black shows through (glass rule). */
.frame{position:absolute;border:1px solid var(--line);box-shadow:0 0 calc(12px*var(--glow)) #f0b32a22, inset 0 0 calc(12px*var(--glow)) #f0b32a14}
.frame::before,.frame::after{content:"";position:absolute;width:calc(9*var(--u));height:calc(9*var(--u));border:1px solid var(--amber);background:var(--glass);transform:rotate(45deg)}
.frame::before{left:calc(-5*var(--u));top:calc(-5*var(--u))}.frame::after{right:calc(-5*var(--u));bottom:calc(-5*var(--u))}
body.mac .frame::before,body.mac .frame::after{background:var(--dash)}
/* Touch targets: 56px on the Surface, never under 44px. */
.chip{display:inline-flex;align-items:center;gap:calc(10*var(--u));min-height:max(44px,calc(56*var(--u)));padding:0 calc(22*var(--u));border:1px solid var(--line);
  color:var(--amber);font:600 calc(20*var(--u)) 'Saira Condensed';letter-spacing:.25em;background:none;cursor:pointer}
.chip.on{border-color:var(--amber);color:var(--amber);box-shadow:0 0 calc(10px*var(--glow)) #f0b32a55}
.chip.fix{border-color:var(--orange);color:var(--orange);box-shadow:0 0 calc(14px*var(--glow)) #ff6a1f66;min-height:max(44px,calc(72*var(--u)));font-size:calc(24*var(--u))}
.row{display:flex;align-items:center;gap:calc(14*var(--u));min-height:max(44px,calc(64*var(--u)));border-top:1px solid #7a5a1455;padding:0 calc(14*var(--u))}
.glyph{width:calc(14*var(--u));height:calc(14*var(--u));transform:rotate(45deg);flex:none}
.beam{position:absolute;left:0;right:0;height:30%;top:-30%;pointer-events:none;background:linear-gradient(to bottom,#0000,#9fffc00d 45%,#d8ffe624 50%,#9fffc00d 55%,#0000)}
.after{animation:after 1.6s ease-out}
@keyframes after{from{filter:brightness(2.4)}to{filter:none}}
.banner{display:flex;align-items:center;justify-content:center;height:calc(40*var(--u));border-top:1px solid var(--red);border-bottom:1px solid var(--red);
  background:repeating-linear-gradient(-45deg,#ff3b2fcc 0 12px,var(--glass) 12px 24px)}
.banner span{background:var(--glass);padding:2px calc(26*var(--u));font:600 calc(20*var(--u)) 'Saira Condensed';letter-spacing:.35em;color:var(--red)}
body.mac .banner{background:repeating-linear-gradient(-45deg,#ff3b2fcc 0 12px,var(--dash) 12px 24px)}body.mac .banner span{background:var(--dash)}
#macbar{display:none;position:absolute;left:0;right:0;top:0;height:92px;border-bottom:1px solid #262626;background:var(--dash);font:14px -apple-system,sans-serif}
body.mac #macbar{display:flex;align-items:flex-end;padding:0 24px 12px;gap:4px}
#macbar b{color:#a3a3a3;font-size:14px;letter-spacing:.05em;margin-right:24px;font-weight:600}
#macbar span{color:#a3a3a3;padding:6px 12px;border-radius:6px}#macbar span.on{background:#262626;color:#fff}
