<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Health Overview Prototype</title>
<style>
/* Look borrowed from brain-map/template.html: same page plane, text tokens, region colours and the amber synapse signal. */
:root{--surface-1:#10151c;--page-plane:#0d1117;--text-primary:#e6edf3;--text-secondary:#8b98a5;--text-muted:#6e7681;--gridline:#21262d;--lesion:#f85149;--caution:#e3b341;--asleep:#58a6ff}
*{box-sizing:border-box}
html,body{margin:0;height:100%;overflow:hidden;background:radial-gradient(ellipse 90% 70% at 50% 45%,#131a24 0%,var(--page-plane) 62%,#05070a 100%);color:var(--text-primary);font:13px/1.45 -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
canvas{position:absolute;inset:0;width:100%;height:100%}
#top{position:absolute;left:16px;top:14px;right:16px;display:flex;gap:10px;align-items:center;flex-wrap:wrap;pointer-events:none}
#top>*{pointer-events:auto}
.crumb{color:var(--text-secondary)}.crumb b{color:var(--text-primary);font-weight:600}
.seg{display:flex;gap:2px;background:#161b22;border:1px solid var(--gridline);border-radius:8px;padding:2px;margin-left:auto}
.seg button{background:none;border:0;color:var(--text-secondary);padding:4px 10px;border-radius:6px;font:inherit;cursor:pointer}
.seg button.on{background:#262c36;color:var(--text-primary)}
#legend{position:absolute;left:16px;bottom:14px;max-width:min(560px,calc(100% - 32px));color:var(--text-secondary);font-size:12px;background:rgba(13,17,23,.75);border:1px solid var(--gridline);border-radius:8px;padding:8px 10px}
#legend span{display:inline-flex;align-items:center;gap:5px;margin-right:12px;white-space:nowrap}
#legend i{display:inline-block;width:9px;height:9px;border-radius:50%}
#panel{position:absolute;right:16px;top:56px;width:min(340px,calc(100% - 32px));max-height:calc(100% - 140px);overflow:auto;background:rgba(16,21,28,.94);border:1px solid var(--gridline);border-radius:10px;padding:12px 14px;display:none}
#panel h3{margin:0 0 2px;font-size:15px}#panel .sub{color:var(--text-muted);font-size:12px;margin-bottom:8px}
#panel li{list-style:none;padding:5px 0;border-top:1px solid var(--gridline);display:flex;gap:8px}
#panel ul{margin:0;padding:0}#panel .d{color:var(--text-secondary);font-size:12px}
.dot{width:8px;height:8px;border-radius:50%;flex:none;margin-top:5px}
</style>
</head>
<body>
<canvas id="c"></canvas>
<div id="top">
  <div class="crumb" id="crumb"></div>
  <div class="seg" id="modes">
    <button data-m="a">Brain</button><button data-m="b">Globe</button><button data-m="c">Globe → brain</button><button data-m="list">List</button>
  </div>
</div>
<div id="legend"></div>
<div id="panel"></div>
<script>
(function () {
"use strict";
// ── Real data: Health on 2026-10-21 (Mini's health-status.json at 21:06 UTC, with the P0/P1 fixes applied: no false reds),
// and event rates measured from the Mini's logs (gh-calls.jsonl last hour, tool-usage.json and token-usage.json, 30 days).
var SYNAPSE = "255,176,59"; // brain-map's reserved "electrical" amber: activity only, never a severity
var REGIONS = {
  pipeline:  { label: "Pipeline",       brain: "motor: does the work",               color: "#d55181", at: [ 270,-120,  40], perHour: 1109, unit: "GitHub calls" },
  github:    { label: "GitHub",         brain: "senses: talks to the outside",       color: "#3987e5", at: [ 430,  50, -60], perHour: 1562, unit: "GitHub calls" },
  code:      { label: "Code & tests",   brain: "judgement: is the code sound",       color: "#199e70", at: [ 210, 100, 150], perHour: 6,    unit: "main-health and CI runs" },
  skills:    { label: "Skills & tools", brain: "cortex: what MARVIN can do",         color: "#c3c2b7", at: [   0,-240,  10], perHour: 39,   unit: "tool calls" },
  sync:      { label: "Code sync",      brain: "corpus callosum: Macs act as one",   color: "#2fb6c4", at: [   0, -20,   0], perHour: 8,    unit: "pushes and pulls" },
  producers: { label: "Producers",      brain: "autonomic: runs on its own",         color: "#7fae3c", at: [-280,-140, -70], perHour: 20,   unit: "job runs" },
  energy:    { label: "Energy",         brain: "metabolism: tokens spent",           color: "#b48a5a", at: [-430,  40,  60], perHour: 47,   unit: "model responses" },
  body:      { label: "Body",           brain: "brainstem: disk, jobs, power",       color: "#9085e9", at: [ -40, 250,   0], perHour: 4,    unit: "health sweeps" }
};
// sev: green | yellow | red | quiet (a producer that stopped) | unknown (couldn't measure)
var CHECKS = [
  ["pipeline", "dispatch:lock-age", "mac-mini-1", "green", "idle"],
  ["pipeline", "pipeline:breaker", "all", "green", "not tripped"],
  ["pipeline", "dispatch:parallel", "mac-mini-1", "yellow", "no suitable machine (scanner reported)"],
  ["pipeline", "profile:no-machines", "all", "green", "every dispatching project lists machines"],
  ["github", "github:budget", "mac-mini-1", "green", "4,861 of 5,000 left"],
  ["github", "github:gate", "mac-mini-1", "green", "1,562 calls last hour (pipeline 1,109)"],
  ["github", "auth:gh", "mac-mini-1", "green", "token authenticates"],
  ["github", "auth:gh", "macbook-pro-1", "green", "token authenticates"],
  ["github", "auth:gh", "mac-mini-2012", "red", "GitHub sign-in expired (dashboard:mr:list ×640 today)"],
  ["github", "errors", "macbook-pro-1", "yellow", "gh down on Approve ×33"],
  ["code", "main:green", "all", "red", "main @ e5f8122 failing: test_portfolio_parity (2)"],
  ["code", "dashboard:build", "mac-mini-1", "green", "app current"],
  ["code", "dashboard:build", "macbook-pro-1", "green", "app current"],
  ["code", "webhook:build", "mac-mini-1", "green", "server current"],
  ["code", "webhook:build", "macbook-pro-1", "green", "server current"],
  ["code", "triggers:missed", "mac-mini-1", "green", "no unannounced changes in 24 h"],
  ["skills", "route:intent-routing-collection", "mac-mini-1", "green", "92 examples indexed"],
  ["skills", "tools:failures", "all", "yellow", "Bash 9.6% failed in 30 d: 1,357 auto-mode denials"],
  ["skills", "errors", "mac-mini-1", "red", "hook:deliverable_location JSONDecodeError, repeating"],
  ["skills", "tools:never-fired", "all", "green", "skills used in the last 30 d"],
  ["sync", "repo:sync ~/.agents", "mac-mini-1", "green", "converged"],
  ["sync", "repo:sync ~/.agents", "macbook-pro-1", "green", "converged"],
  ["sync", "repo:sync ~/.agents", "mac-mini-2012", "green", "converged"],
  ["sync", "repo:sync ~/.claude", "mac-mini-1", "green", "converged"],
  ["sync", "repo:sync ~/.claude", "macbook-pro-1", "green", "converged"],
  ["sync", "health:heartbeat", "macbook-pro-1", "green", "last push 2 min ago"],
  ["sync", "health:heartbeat", "mac-mini-2012", "green", "last push 4 min ago"],
  ["producers", "catalog:fresh", "mac-mini-1", "green", "34 projects, built 1.4 h ago"],
  ["producers", "tickets:project-tags", "mac-mini-1", "quiet", "the project tagger stopped writing on 10-09"],
  ["producers", "tickets:hold-revisit", "mac-mini-1", "unknown", "couldn't measure: the revisit agent never wrote here"],
  ["producers", "seal:beta-ingest", "mac-mini-1", "green", "last report 8 days ago"],
  ["producers", "daily-digest", "mac-mini-1", "green", "ran on time"],
  ["producers", "research-colony", "mac-mini-1", "green", "ran on time"],
  ["producers", "cleanup-sweep", "mac-mini-1", "green", "ran on time"],
  ["energy", "usage:scan", "mac-mini-1", "green", "24.1 M output tokens in 30 d"],
  ["energy", "usage:scan", "macbook-pro-1", "green", "scanned 40 min ago"],
  ["body", "disk:space", "mac-mini-1", "red", "18 GiB free of 228 (8%)"],
  ["body", "disk:headroom", "mac-mini-1", "yellow", "15 GiB in about 7 days"],
  ["body", "disk:space", "macbook-pro-1", "yellow", "73 GiB free of 460 (16%)"],
  ["body", "disk:headroom", "macbook-pro-1", "green", "39 days"],
  ["body", "jobs:exit", "mac-mini-1", "green", "20 jobs exited cleanly"],
  ["body", "jobs:exit", "macbook-pro-1", "green", "13 jobs exited cleanly"],
  ["body", "jobs:placement", "all", "green", "plists match their placement"],
  ["body", "desktoplive", "mac-mini-1", "green", "running"],
  ["body", "desktoplive", "macbook-pro-1", "green", "running"]
];
var LINKS = [["pipeline", "github"], ["pipeline", "code"], ["pipeline", "skills"], ["pipeline", "energy"], ["sync", "code"],
             ["sync", "body"], ["producers", "github"], ["producers", "energy"], ["skills", "energy"], ["body", "pipeline"]];
var SEV = { green: null, yellow: "#e3b341", red: "#f85149", quiet: "#3a3f47", unknown: "#6e7681" };
var PLACES = {
  "mac-mini-1":    { label: "Mac mini (M4)",   role: "primary host",        lat:  20, lon: -35 },
  "macbook-pro-1": { label: "MacBook Pro",     role: "laptop · travels",    lat: -18, lon:  38 },
  "mac-mini-2012": { label: "2012 box (Kali)", role: "Linux node",          lat:  42, lon:  20 },
  "phone":         { label: "iPhone",          role: "not reporting yet",   lat: -38, lon: -40 }
};
var ARCS = [ // Tailscale links, with the traffic they carry (events/hour)
  { a: "mac-mini-1", b: "macbook-pro-1", perHour: 20, what: "peer pushes, code-sync" },
  { a: "mac-mini-1", b: "mac-mini-2012", perHour: 12, what: "mirror pulls, peer pushes" },
  { a: "mac-mini-1", b: "phone", perHour: 6, what: "mobile backend" },
  { a: "mac-mini-1", b: "github", perHour: 1562, what: "GitHub calls" },
  { a: "macbook-pro-1", b: "github", perHour: 160, what: "GitHub calls" },
  { a: "mac-mini-2012", b: "github", perHour: 640, what: "GitHub calls, all refused: sign-in expired", broken: true }
];
var SPEED = 60;           // 1 s on screen = 1 min of real time
var EVENTS_PER_PULSE = 10;

var q = new URLSearchParams(location.search);
var mode = q.get("mode") || "a";
var frozen = q.has("t") ? parseFloat(q.get("t")) : null;
var focusRegion = q.get("region");
var canvas = document.getElementById("c"), ctx = canvas.getContext("2d"), W, H, DPR;
function resize() { DPR = window.devicePixelRatio || 1; W = innerWidth; H = innerHeight; canvas.width = W * DPR; canvas.height = H * DPR; ctx.setTransform(DPR, 0, 0, DPR, 0, 0); }
addEventListener("resize", resize); resize();

// Deterministic jitter, so the same check always sits in the same place.
function hash(s) { var h = 2166136261; for (var i = 0; i < s.length; i++) { h ^= s.charCodeAt(i); h = Math.imul(h, 16777619); } return (h >>> 0) / 4294967296; }

// ── camera: brain-map's project(), yaw/pitch, perspective ───────────────
var yaw = 0.35, pitch = -0.18, camDist = 900, focal = 760;
function project(p, cx, cy, s) {
  var c = Math.cos(yaw), si = Math.sin(yaw), cp = Math.cos(pitch), sp = Math.sin(pitch);
  var x1 = p.x * c - p.z * si, z1 = p.x * si + p.z * c, y2 = p.y * cp - z1 * sp, z2 = p.y * sp + z1 * cp;
  var f = focal / Math.max(z2 + camDist, 30) * (s || 1);
  return { sx: (cx == null ? W / 2 : cx) + x1 * f, sy: (cy == null ? H / 2 : cy) + y2 * f, depth: z2, scale: f };
}

// ── brain: one neuron per check instance, clustered by region ───────────
function buildBrain(machine) {
  var neurons = [];
  CHECKS.forEach(function (c, i) {
    if (machine && c[2] !== machine && c[2] !== "all") return;
    var R = REGIONS[c[0]], k = c[1] + "@" + c[2];
    var a = hash(k) * Math.PI * 2, b = hash(k + "b") * Math.PI - Math.PI / 2, d = 32 + hash(k + "d") * 44;
    neurons.push({ region: c[0], id: c[1], machine: c[2], sev: c[3], detail: c[4],
      p: { x: R.at[0] + Math.cos(a) * Math.cos(b) * d, y: R.at[1] + Math.sin(b) * d * 0.8, z: R.at[2] + Math.sin(a) * Math.cos(b) * d } });
  });
  return neurons;
}
var brainAll = buildBrain(null), brainMini = buildBrain("mac-mini-1");

function regionSummary(neurons, key) {
  var n = neurons.filter(function (x) { return x.region === key; });
  var bad = n.filter(function (x) { return x.sev === "red"; }).length, warn = n.filter(function (x) { return x.sev === "yellow"; }).length;
  var quiet = n.filter(function (x) { return x.sev === "quiet" || x.sev === "unknown"; }).length;
  return { n: n.length, bad: bad, warn: warn, quiet: quiet };
}

// Pulses: emitted on a region's links at its real rate (sped up, 1 pulse = 10 events). Deterministic in t.
function pulsesOn(rate, t, salt) {
  var perSec = rate / 3600 * SPEED / EVENTS_PER_PULSE, out = [];
  if (perSec <= 0) return out;
  var period = 1 / perSec, travel = 1.6, first = Math.floor((t - travel) / period);
  for (var k = Math.max(0, first); k * period <= t; k++) {
    var born = k * period + hash(salt + k) * period * 0.6, age = (t - born) / travel;
    if (age >= 0 && age <= 1) out.push(age);
  }
  return out.slice(-12);
}

function glowDisc(x, y, r, color, glow, alpha) {
  ctx.save(); ctx.globalAlpha = alpha == null ? 1 : alpha;
  if (glow) { ctx.shadowBlur = glow; ctx.shadowColor = color; }
  ctx.beginPath(); ctx.arc(x, y, r, 0, Math.PI * 2); ctx.fillStyle = color; ctx.fill(); ctx.restore();
}

function drawLesion(x, y, r, t, seed) {
  // A misfiring lesion: red core, a jagged halo that flickers irregularly (never the amber of healthy activity).
  var flick = 0.55 + 0.45 * Math.abs(Math.sin(t * 7.3 + seed * 20) * Math.sin(t * 2.1 + seed * 9));
  ctx.save(); ctx.strokeStyle = "rgba(248,81,73," + (0.35 + 0.5 * flick) + ")"; ctx.lineWidth = 1.4;
  ctx.shadowBlur = 14 * flick; ctx.shadowColor = "#f85149"; ctx.beginPath();
  for (var i = 0; i <= 18; i++) { var a = i / 18 * Math.PI * 2, rr = r + 6 + (hash(seed + ":" + i + ":" + Math.floor(t * 6)) * 7) * flick;
    var px = x + Math.cos(a) * rr, py = y + Math.sin(a) * rr; i ? ctx.lineTo(px, py) : ctx.moveTo(px, py); }
  ctx.stroke(); ctx.restore();
  glowDisc(x, y, r, "#f85149", 18 * flick, 1);
}

function label(text, x, y, color, size, align, weight) {
  ctx.save(); ctx.font = (weight || 500) + " " + (size || 12) + "px -apple-system,BlinkMacSystemFont,sans-serif";
  ctx.textAlign = align || "center"; ctx.fillStyle = "rgba(5,7,10,.75)";
  var w = ctx.measureText(text).width; var bx = align === "left" ? x - 3 : align === "right" ? x - w - 3 : x - w / 2 - 3;
  ctx.fillRect(bx, y - (size || 12) + 1, w + 6, (size || 12) + 5);
  ctx.fillStyle = color || "#e6edf3"; ctx.fillText(text, x, y + 1); ctx.restore();
}

function drawBrain(neurons, t, cx, cy, s, opts) {
  opts = opts || {};
  var hubs = {};
  Object.keys(REGIONS).forEach(function (k) { var R = REGIONS[k]; hubs[k] = project({ x: R.at[0], y: R.at[1], z: R.at[2] }, cx, cy, s); });
  // inter-region synapses with traffic at the real rate
  LINKS.forEach(function (l, li) {
    var A = hubs[l[0]], B = hubs[l[1]], rate = Math.min(REGIONS[l[0]].perHour, REGIONS[l[1]].perHour);
    var mx = (A.sx + B.sx) / 2, my = (A.sy + B.sy) / 2 - 30 * (s || 1);
    ctx.save(); ctx.strokeStyle = "rgba(139,152,165,.18)"; ctx.lineWidth = 1; ctx.beginPath(); ctx.moveTo(A.sx, A.sy); ctx.quadraticCurveTo(mx, my, B.sx, B.sy); ctx.stroke(); ctx.restore();
    pulsesOn(rate, t, "L" + li).forEach(function (u) {
      var x = (1 - u) * (1 - u) * A.sx + 2 * (1 - u) * u * mx + u * u * B.sx, y = (1 - u) * (1 - u) * A.sy + 2 * (1 - u) * u * my + u * u * B.sy;
      glowDisc(x, y, 2.2 * (s || 1), "rgba(" + SYNAPSE + ",1)", 10, Math.sin(u * Math.PI));
    });
  });
  // neurons, far to near
  var drawn = neurons.map(function (n) { return { n: n, p: project(n.p, cx, cy, s) }; }).sort(function (a, b) { return b.p.depth - a.p.depth; });
  drawn.forEach(function (d, i) {
    var n = d.n, R = REGIONS[n.region], hub = hubs[n.region], r = Math.max(2.4, 4.2 * d.p.scale), dim = focusRegion && focusRegion !== n.region;
    ctx.save(); ctx.globalAlpha = dim ? 0.15 : 0.35; ctx.strokeStyle = R.color; ctx.lineWidth = 0.8;
    ctx.beginPath(); ctx.moveTo(hub.sx, hub.sy); ctx.lineTo(d.p.sx, d.p.sy); ctx.stroke(); ctx.restore();
    var seed = hash(n.id + n.machine);
    if (dim) { glowDisc(d.p.sx, d.p.sy, r, "rgba(110,118,129,0.35)", 0, 0.6); return; }
    if (n.sev === "red") { drawLesion(d.p.sx, d.p.sy, r, t, seed); return; }
    if (n.sev === "quiet") { glowDisc(d.p.sx, d.p.sy, r, "#30363d", 0, 1); ctx.save(); ctx.strokeStyle = "#484f58"; ctx.setLineDash([2, 2]); ctx.beginPath(); ctx.arc(d.p.sx, d.p.sy, r + 3, 0, 7); ctx.stroke(); ctx.restore(); return; }
    if (n.sev === "unknown") { ctx.save(); ctx.strokeStyle = "#6e7681"; ctx.setLineDash([2, 3]); ctx.lineWidth = 1.3; ctx.beginPath(); ctx.arc(d.p.sx, d.p.sy, r + 1, 0, 7); ctx.stroke(); ctx.restore(); return; }
    // healthy neurons fire with their region's real activity; the ripple is brain-map's "just fired" signal
    var fire = 0, per = 3600 / Math.max(R.perHour, 0.01) / SPEED * EVENTS_PER_PULSE * 3;
    var ph = ((t + seed * per) % per) / per; if (ph < 0.18) fire = 1 - ph / 0.18;
    if (fire > 0) { ctx.save(); ctx.strokeStyle = "rgba(" + SYNAPSE + "," + fire * 0.6 + ")"; ctx.lineWidth = 1.2; ctx.shadowBlur = 10; ctx.shadowColor = "rgba(" + SYNAPSE + ",.8)"; ctx.beginPath(); ctx.arc(d.p.sx, d.p.sy, r + 2 + (1 - fire) * 14, 0, 7); ctx.stroke(); ctx.restore(); }
    glowDisc(d.p.sx, d.p.sy, r + fire, fire > 0.5 ? "rgba(" + SYNAPSE + ",1)" : R.color, 6 + fire * 12, 0.9);
    if (n.sev === "yellow") { ctx.save(); ctx.strokeStyle = "#e3b341"; ctx.lineWidth = 1.6; ctx.globalAlpha = 0.55 + 0.45 * Math.abs(Math.sin(t * 1.5 + seed * 6)); ctx.beginPath(); ctx.arc(d.p.sx, d.p.sy, r + 4, 0, 7); ctx.stroke(); ctx.restore(); }
  });
  // region hubs and labels
  Object.keys(REGIONS).forEach(function (k) {
    var R = REGIONS[k], h = hubs[k], sm = regionSummary(neurons, k);
    if (!sm.n) return;
    var dim = focusRegion && focusRegion !== k;
    glowDisc(h.sx, h.sy, 6.5 * h.scale, dim ? "#30363d" : R.color, dim ? 0 : 10, 1);
    ctx.save(); ctx.strokeStyle = "rgba(255,255,255,.28)"; ctx.setLineDash([2, 3]); ctx.beginPath(); ctx.arc(h.sx, h.sy, 6.5 * h.scale + 4, 0, 7); ctx.stroke(); ctx.restore();
    if (opts.labels === false) return;
    var line2 = sm.bad ? sm.bad + " lesion" + (sm.bad > 1 ? "s" : "") : sm.warn ? sm.warn + " degraded" : sm.quiet ? sm.quiet + " quiet" : "healthy";
    var col = sm.bad ? "#ff7b72" : sm.warn ? "#e3b341" : sm.quiet ? "#8b98a5" : "#7ee2a8";
    label(R.label, h.sx, h.sy - 16 * h.scale - 8, dim ? "#6e7681" : "#e6edf3", 13, "center", 600);
    if (!dim) label(line2 + " · " + R.perHour.toLocaleString() + " " + R.unit + "/h", h.sx, h.sy - 16 * h.scale + 8, col, 11);
  });
  // name the lesions themselves
  if (opts.lesionLabels !== false) drawn.forEach(function (d) {
    if (d.n.sev !== "red" || (focusRegion && focusRegion !== d.n.region)) return;
    label(d.n.id + (d.n.machine !== "all" ? " @ " + d.n.machine : ""), d.p.sx + 14, d.p.sy + 18, "#ff7b72", 11, "left");
  });
}

// ── globe: places, Tailscale arcs with traffic, weather over trouble ─────
function sph(lat, lon, R) { var a = lat * Math.PI / 180, b = lon * Math.PI / 180; return { x: R * Math.cos(a) * Math.sin(b), y: -R * Math.sin(a), z: -R * Math.cos(a) * Math.cos(b) }; }
function placeWeather(id) {
  var mine = CHECKS.filter(function (c) { return c[2] === id; });
  return { bad: mine.filter(function (c) { return c[3] === "red"; }), warn: mine.filter(function (c) { return c[3] === "yellow"; }), n: mine.length };
}
function drawCloud(x, y, s, color, t, rain) {
  ctx.save(); ctx.fillStyle = color; ctx.globalAlpha = 0.9; ctx.shadowBlur = 14; ctx.shadowColor = color;
  [[-14, 2, 11], [0, -5, 14], [14, 2, 10], [4, 5, 11]].forEach(function (c) { ctx.beginPath(); ctx.arc(x + c[0] * s, y + c[1] * s, c[2] * s, 0, 7); ctx.fill(); });
  ctx.restore();
  if (rain) for (var i = 0; i < 6; i++) { var ph = (t * 1.4 + i / 6) % 1, rx = x + (i - 2.5) * 6 * s;
    ctx.save(); ctx.strokeStyle = color; ctx.globalAlpha = 1 - ph; ctx.lineWidth = 1.5; ctx.beginPath(); ctx.moveTo(rx, y + 14 * s + ph * 18 * s); ctx.lineTo(rx - 2, y + 20 * s + ph * 18 * s); ctx.stroke(); ctx.restore(); }
}
function drawGlobe(t, cx, cy, R, opts) {
  opts = opts || {};
  var saveYaw = yaw, savePitch = pitch; yaw = Math.sin(t * 0.05) * 0.35; pitch = -0.28;
  // graticule (faint): the sphere itself, no data
  ctx.save(); ctx.strokeStyle = "rgba(48,54,61,.9)"; ctx.lineWidth = 0.8;
  for (var lat = -60; lat <= 60; lat += 30) { ctx.beginPath(); for (var lon = 0; lon <= 360; lon += 6) { var p = project(sph(lat, lon, R), cx, cy); if (p.depth > 40) { ctx.moveTo(p.sx, p.sy); continue; } lon ? ctx.lineTo(p.sx, p.sy) : ctx.moveTo(p.sx, p.sy); } ctx.stroke(); }
  for (var lo = 0; lo < 360; lo += 30) { ctx.beginPath(); for (var la = -90; la <= 90; la += 6) { var p2 = project(sph(la, lo, R), cx, cy); if (p2.depth > 40) { ctx.moveTo(p2.sx, p2.sy); continue; } la > -90 ? ctx.lineTo(p2.sx, p2.sy) : ctx.moveTo(p2.sx, p2.sy); } ctx.stroke(); }
  ctx.restore();
  var g = ctx.createRadialGradient(cx, cy, R * 0.2, cx, cy, R * 1.05); g.addColorStop(0, "rgba(47,182,196,.05)"); g.addColorStop(1, "rgba(47,182,196,.0)");
  ctx.fillStyle = g; ctx.beginPath(); ctx.arc(cx, cy, R * 0.86, 0, 7); ctx.fill();
  var pos = {};
  Object.keys(PLACES).forEach(function (id) { var P = PLACES[id]; pos[id] = project(sph(P.lat, P.lon, R), cx, cy); });
  pos.github = { sx: cx + R * 0.05, sy: cy - R * 1.12, depth: -999, scale: 1 };
  // arcs
  ARCS.forEach(function (A, i) {
    var a = pos[A.a], b = pos[A.b]; if (!a || !b) return;
    var mx = (a.sx + b.sx) / 2, my = Math.min(a.sy, b.sy) - R * 0.28;
    ctx.save(); ctx.lineWidth = A.broken ? 1.6 : 1.2;
    ctx.strokeStyle = A.broken ? "rgba(248,81,73,.85)" : "rgba(86,212,221,.35)";
    if (A.broken) ctx.setLineDash([6, 5]);
    ctx.beginPath(); ctx.moveTo(a.sx, a.sy); ctx.quadraticCurveTo(mx, my, b.sx, b.sy); ctx.stroke(); ctx.restore();
    if (A.broken) { var bx = 0.25 * a.sx + 0.5 * mx + 0.25 * b.sx, by = 0.25 * a.sy + 0.5 * my + 0.25 * b.sy;
      ctx.save(); ctx.strokeStyle = "#f85149"; ctx.lineWidth = 2; ctx.beginPath(); ctx.moveTo(bx - 6, by - 6); ctx.lineTo(bx + 6, by + 6); ctx.moveTo(bx + 6, by - 6); ctx.lineTo(bx - 6, by + 6); ctx.stroke(); ctx.restore();
      if (opts.labels !== false) label("sign-in expired: 640 refused calls today", bx + 12, by + 18, "#ff7b72", 11, "left");
      return; }
    pulsesOn(A.perHour, t, "A" + i).forEach(function (u) {
      var x = (1 - u) * (1 - u) * a.sx + 2 * (1 - u) * u * mx + u * u * b.sx, y = (1 - u) * (1 - u) * a.sy + 2 * (1 - u) * u * my + u * u * b.sy;
      glowDisc(x, y, 2.2, "rgba(" + SYNAPSE + ",1)", 10, Math.sin(u * Math.PI));
    });
  });
  // GitHub, outside the tailnet
  glowDisc(pos.github.sx, pos.github.sy, 7, "#8b98a5", 8, 1);
  if (opts.labels !== false) label("GitHub (outside the tailnet)", pos.github.sx, pos.github.sy - 14, "#8b98a5", 11);
  // places + weather
  Object.keys(PLACES).forEach(function (id) {
    var P = PLACES[id], p = pos[id], w = placeWeather(id), sel = opts.selected === id;
    var behind = p.depth > 40, alpha = behind ? 0.35 : 1;
    var col = id === "phone" ? "#6e7681" : w.bad.length ? "#f85149" : w.warn.length ? "#e3b341" : "#3fb950";
    glowDisc(p.sx, p.sy, sel ? 9 : 7, col, 12, alpha);
    if (sel) { ctx.save(); ctx.strokeStyle = "#ffffff"; ctx.lineWidth = 2; ctx.beginPath(); ctx.arc(p.sx, p.sy, 14, 0, 7); ctx.stroke(); ctx.restore(); }
    if (w.bad.length) drawCloud(p.sx, p.sy - 34, 0.9, "#c93c37", t, true);
    else if (w.warn.length) drawCloud(p.sx, p.sy - 32, 0.75, "#b8901f", t, false);
    if (opts.labels === false) return;
    label(P.label, p.sx, p.sy + 26, "#e6edf3", 12, "center", 600);
    var line = id === "phone" ? "not reporting yet" : w.bad.length ? w.bad.map(function (c) { return c[1]; }).join(", ") : w.warn.length ? w.warn.length + " degraded" : "clear";
    label(line + (id === "phone" ? "" : " · " + P.role), p.sx, p.sy + 42, w.bad.length ? "#ff7b72" : w.warn.length ? "#e3b341" : "#8b98a5", 11);
  });
  yaw = saveYaw; pitch = savePitch;
  return pos;
}

// ── frame ────────────────────────────────────────────────────────────
var t0 = performance.now();
function frame(now) {
  var t = frozen != null ? frozen : (now - t0) / 1000;
  ctx.clearRect(0, 0, W, H);
  if (mode === "a") {
    yaw = 0.35 + Math.sin(t * 0.08) * 0.35; pitch = -0.18;
    drawBrain(brainAll, t, W / 2 - (W > 900 ? 150 : 0), H / 2 - 30, Math.min(W, H * 1.4) / 1250);
  } else if (mode === "b") {
    drawGlobe(t, W / 2, H / 2 + 30, Math.min(W, H) * 0.33);
  } else if (mode === "c") {
    var gx = W * 0.22, gy = H * 0.55, gr = Math.min(W * 0.17, H * 0.3);
    var pos = drawGlobe(t, gx, gy, gr, { selected: "mac-mini-1", labels: false });
    var m = pos["mac-mini-1"], bx = W * 0.64, by = H * 0.52;
    // the zoom: the Mini opens into its own brain
    ctx.save(); ctx.fillStyle = "rgba(86,212,221,.05)"; ctx.strokeStyle = "rgba(86,212,221,.35)"; ctx.setLineDash([4, 4]);
    ctx.beginPath(); ctx.moveTo(m.sx, m.sy); ctx.lineTo(bx - W * 0.25, by - H * 0.36); ctx.lineTo(bx - W * 0.25, by + H * 0.38); ctx.closePath(); ctx.fill(); ctx.stroke(); ctx.restore();
    label("Mac mini (M4)", m.sx, m.sy + 26, "#e6edf3", 12, "center", 600);
    yaw = 0.35 + Math.sin(t * 0.08) * 0.3; pitch = -0.18;
    drawBrain(brainMini, t, bx, by - 20, Math.min(W * 0.6, H * 1.3) / 1150);
    label("mac-mini-1's brain: its own checks plus the shared ones", bx, H - 70, "#8b98a5", 12);
  }
  if (frozen == null) requestAnimationFrame(frame);
}

// ── chrome: breadcrumb, legend, mode switch, region panel ─────────────
var CRUMBS = { a: "<b>Health</b> › All Macs › <span>pick a region</span>", b: "<b>Health</b> › <span>pick a place</span>", c: "<b>Health</b> › Mac mini (M4) › <span>pick a region</span>", list: "" };
var LEGENDS = {
  a: '<span><i style="background:#7ee2a8"></i>neuron = one check on one Mac</span><span><i style="background:rgb(' + SYNAPSE + ')"></i>firing = real activity (×60 time, 1 pulse = 10 events)</span><span><i style="background:#f85149"></i>lesion = broken now</span><span><i style="border:1.5px solid #e3b341"></i>ring = degraded</span><span><i style="background:#30363d;border:1px dashed #6e7681"></i>quiet = producer stopped</span><span><i style="border:1px dashed #6e7681"></i>couldn\'t measure</span>',
  b: '<span><i style="background:#3fb950"></i>clear</span><span><i style="background:#e3b341"></i>cloud = degraded</span><span><i style="background:#f85149"></i>storm = broken</span><span><i style="background:rgb(' + SYNAPSE + ')"></i>arc traffic (×60, 1 pulse = 10 events)</span><span><i style="border:1.5px dashed #f85149"></i>broken link</span><span>Places sit by role, not geography: all four are at home; the laptop travels.</span>',
  c: '<span>The globe is the "where"; zooming a place opens its brain. Same legend as Brain.</span>'
};
function setMode(m) {
  mode = m;
  document.querySelectorAll("#modes button").forEach(function (b) { b.classList.toggle("on", b.dataset.m === m); });
  document.getElementById("crumb").innerHTML = CRUMBS[m] || "";
  document.getElementById("legend").innerHTML = LEGENDS[m] || "";
  if (frozen == null) requestAnimationFrame(frame); else frame(0);
}
document.querySelectorAll("#modes button").forEach(function (b) { b.onclick = function () { setMode(b.dataset.m); }; });
function showRegion(k) {
  var R = REGIONS[k], rows = CHECKS.filter(function (c) { return c[0] === k; });
  var html = "<h3>" + R.label + "</h3><div class='sub'>" + R.brain + " · " + R.perHour.toLocaleString() + " " + R.unit + " an hour</div><ul>";
  rows.sort(function (a, b) { var o = { red: 0, yellow: 1, quiet: 2, unknown: 3, green: 4 }; return o[a[3]] - o[b[3]]; }).forEach(function (c) {
    var col = SEV[c[3]] || REGIONS[k].color;
    html += "<li><span class='dot' style='background:" + col + "'></span><div><div>" + c[1] + (c[2] !== "all" ? " @ " + c[2] : "") + "</div><div class='d'>" + c[4] + "</div></div></li>";
  });
  document.getElementById("panel").innerHTML = html + "</ul>";
  document.getElementById("panel").style.display = "block";
  document.getElementById("crumb").innerHTML = "<b>Health</b> › All Macs › <b>" + R.label + "</b> › <span>pick a check</span>";
}
canvas.addEventListener("click", function (ev) {
  if (mode !== "a") return;
  var best = null, bd = 40;
  Object.keys(REGIONS).forEach(function (k) { var R = REGIONS[k], h = project({ x: R.at[0], y: R.at[1], z: R.at[2] }, W / 2 - (W > 900 ? 150 : 0), H / 2 - 30, Math.min(W, H * 1.4) / 1250);
    var d = Math.hypot(h.sx - ev.clientX, h.sy - ev.clientY); if (d < bd) { bd = d; best = k; } });
  if (best) { focusRegion = best; showRegion(best); }
});
setMode(mode);
if (focusRegion) showRegion(focusRegion);
})();
</script>
