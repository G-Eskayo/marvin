le</text><rect x='520.0' y='52' width='22' height='18' rx='4' fill='#fee2e2' stroke='#dc2626' stroke-width='2'/><text x='550.0' y='66' font-family='-apple-system, Segoe UI, Helvetica, Arial, sans-serif' font-size='14' font-weight='400' fill='#111827' text-anchor='start'>Known problem (listed in the doc)</text><rect x='817.6' y='52' width='22' height='18' rx='4' fill='#f3f4f6' stroke='#9ca3af' stroke-width='2'/><text x='847.6' y='66' font-family='-apple-system, Segoe UI, Helvetica, Arial, sans-serif' font-size='14' font-weight='400' fill='#111827' text-anchor='start'>Planned, not built</text><rect x='1007.2' y='52' width='22' height='18' rx='4' fill='#e0e7ff' stroke='#4f46e5' stroke-width='2'/><text x='1037.2' y='66' font-family='-apple-system, Segoe UI, Helvetica, Arial, sans-serif' font-size='14' font-weight='400' fill='#111827' text-anchor='start'>Your step</text><rect x='40' y='110' width='220' height='74' rx='10' fill='#fef3c7' stroke='#d97706' stroke-width='2'/><text x='150.0' y='142.16666666666666' font-family='-apple-system, Segoe UI, Helvetica, Arial, sans-serif' font-size='15' font-weight='700' fill='#111827' text-anchor='middle'>NEW</text><text x='150.0' y='161.16666666666666' font-family='-apple-system, Segoe UI, Helvetica, Arial, sans-serif' font-size='14' font-weight='400' fill='#111827' text-anchor='middle'>just filed, no state</text><rect x='330' y='110' width='240' height='74' rx='10' fill='#fef3c7' stroke='#d97706' stroke-width='2'/><text x='450.0' y='142.16666666666666' font-family='-apple-system, Segoe UI, Helvetica, Arial, sans-serif' font-size='15' font-weight='700' fill='#111827' text-anchor='middle'>needs-info</text><text x='450.0' y='161.16666666666666' font-family='-apple-system, Segoe UI, Helvetica, Arial, sans-serif' font-size='14' font-weight='400' fill='#111827' text-anchor='middle'>something's missing</text><rect x='330' y='230' width='240' height='74' rx='10' fill='#e0e7ff' stroke='#4f46e5' stroke-width='2'/><text x='450.0' y='262.1666