 fragile</text><rect x='520.0' y='52' width='22' height='18' rx='4' fill='#fee2e2' stroke='#dc2626' stroke-width='2'/><text x='550.0' y='66' font-family='-apple-system, Segoe UI, Helvetica, Arial, sans-serif' font-size='14' font-weight='400' fill='#111827' text-anchor='start'>Known problem (listed in the doc)</text><rect x='817.6' y='52' width='22' height='18' rx='4' fill='#f3f4f6' stroke='#9ca3af' stroke-width='2'/><text x='847.6' y='66' font-family='-apple-system, Segoe UI, Helvetica, Arial, sans-serif' font-size='14' font-weight='400' fill='#111827' text-anchor='start'>Planned, not built</text><rect x='1007.2' y='52' width='22' height='18' rx='4' fill='#e0e7ff' stroke='#4f46e5' stroke-width='2'/><text x='1037.2' y='66' font-family='-apple-system, Segoe UI, Helvetica, Arial, sans-serif' font-size='14' font-weight='400' fill='#111827' text-anchor='start'>Your step</text><text x='330' y='112' font-family='-apple-system, Segoe UI, Helvetica, Arial, sans-serif' font-size='13' font-weight='400' fill='#6b7280' text-anchor='start'>0%</text><text x='850' y='112' font-family='-apple-system, Segoe UI, Helvetica, Arial, sans-serif' font-size='13' font-weight='400' fill='#6b7280' text-anchor='end'>100% automatic</text><text x='310' y='154' font-family='-apple-system, Segoe UI, Helvetica, Arial, sans-serif' font-size='15' font-weight='700' fill='#111827' text-anchor='end'>Ideas → tickets</text><rect x='330' y='136' width='520' height='26' rx='6' fill='#f3f4f6'/><rect x='330' y='136' width='234.0' height='26' rx='6' fill='#d97706'/><line x1='772.0' y1='130' x2='772.0' y2='168' stroke='#111827' stroke-width='3'/><text x='338' y='155' font-family='-apple-system, Segoe UI, Helvetica, Arial, sans-serif' font-size='13' font-weight='700' fill='white' text-anchor='start'>45%</text><text x='866' y='154' font-family='-apple-system, Segoe UI, Helvetica, Arial, sans-serif' font-size='13' font-weight='400' fill='#374151' text-anchor='start'>digests and sweeps suggest; most tickets still start from you</text><text x='310' y='212' font-family='-apple-system, Segoe UI, Helvetica, Arial, sans-serif' font-size='15' font-weight='700' fill='#111827' text-anchor='end'>Triage</text><rect x='330' y='194' width='520' height='26' rx='6' fill='#f3f4f6'/><rect x='330' y='194' width='416.0' height='26' rx='6' fill='#16a34a'/><line x1='824.0' y1='188' x2='824.0' y2='226' stroke='#111827' stroke-width='3'/><text x='338' y='213' font-family='-apple-system, Segoe UI, Helvetica, Arial, sans-serif' font-size='13' font-weight='700' fill='white' text-anchor='start'>80%</text><text x='866' y='212' font-family='-apple-system, Segoe UI, Helvetica, Arial, sans-serif' font-size='13' font-weight='400' fill='#374151' text-anchor='start'>acting since 2026-10-09; needs-info waits for answers</text><text x='310' y='270' font-family='-apple-system, Segoe UI, Helvetica, Arial, sans-serif' font-size='15' font-weight='700' fill='#111827' text-anchor='end'>Prioritize</text><rect x='330' y='252' width='520' height='26' rx='6' fill='#f3f4f6'/><rect x='330' y='252' width='208.0' height='26' rx='6' fill='#d97706'/><line x1='798.0' y1='246' x2='798.0' y2='284' stroke='#111827' stroke-width='3'/><text x='338' y='271' font-family='-apple-system, Segoe UI, Helvetica, Arial, sans-serif' font-size='13' font-weight='700' fill='white' text-anchor='start'>40%</text><text x='866' y='270' font-family='-apple-system, Segoe UI, Helvetica, Arial, sans-serif' font-size='13' font-weight='400' fill='#374151' text-anchor='start'>still propose-only: scores are computed, not applied</text><text x='310' y='328' font-family='-apple-system, Segoe UI, Helvetica, Arial, sans-serif' font-size='15' font-weight='700' fill='#111827' text-anchor='end'>Dispatch (MARVIN)</text><rect x='330' y='310' width='520' height='26' rx='6' fill='#f3f4f6'/><rect x='330' y='310' width='390.0' height='26' rx='6' fill='#16a34a'/><line x1='824.0' y1='304' x2='824.0' y2='342' stroke='#111827' stroke-width='3'/><text x='338' y='329' font-family='-apple-system, Segoe UI, Helvetica, Arial, sans-serif' font-size='13' font-weight='700' fill='white' text-anchor='start'>75%</text><text x='866' y='328' font-family='-apple-system, Segoe UI, Helvetica, Arial, sans-serif' font-size='13' font-weight='400' fill='#374151' text-anchor='start'>hourly on the mini; parallel dispatch built</text><text x='310' y='386' font-family='-apple-system, Segoe UI, Helvetica, Arial, sans-serif' font-size='15' font-weight='700' fill='#111827' text-anchor='end'>Dispatch (other projects)</text><rect x='330' y='368' width='520' height='26' rx='6' fill='#f3f4f6'/><rect x='330' y='368' width='78.0' height='26' rx='6' fill='#dc2626'/><line x1='772.0' y1='362' x2='772.0' y2='400' stroke='#111827' stroke-width='3'/><text x='338' y='387' font-family='-apple-system, Segoe UI, Helvetica, Arial, sans-serif' font-size='13' font-weight='700' fill='white' text-anchor='start'>15%</text><text x='866' y='386' font-family='-apple-system, Segoe UI, Helvetica, Arial, sans-serif' font-size='13' font-weight='400' fill='#374151' text-anchor='start'>profiles ready, dispatch off for most</text><text x='310' y='444' font-family='-apple-system, Segoe UI, Helvetica, Arial, sans-serif' font-size='15' font-weight='700' fill='#111827' text-anchor='end'>Build + verify</text><rect x='330' y='426' width='520' height='26' rx='6' fill='#f3f4f6'/><rect x='330' y='426' width='390.0' height='26' rx='6' fill='#16a34a'/><line x1='798.0' y1='420' x2='798.0' y2='458' stroke='#111827' stroke-width='3'/><text x='338' y='445' font-family='-apple-system, Segoe UI, Helvetica, Arial, sans-serif' font-size='13' font-weight='700' fill='white' text-anchor='start'>75%</text><text x='866' y='444' font-family='-apple-system, Segoe UI, Helvetica, Arial, sans-serif' font-size='13' font-weight='400' fill='#374151' text-anchor='start'>agents build and test in worktrees</text><text x='310' y='502' font-family='-apple-system, Segoe UI, Helvetica, Arial, sans-serif' font-size='15' font-weight='700' fill='#111827' text-anchor='end'>Review + approve</text><rect x='330' y='484' width='520' height='26' rx='6' fill='#f3f4f6'/><rect x='330' y='484' width='52.0' height='26' rx='6' fill='#dc2626'/><line x1='694.0' y1='478' x2='694.0' y2='516' stroke='#111827' stroke-width='3'/><text x='338' y='503' font-family='-apple-system, Segoe UI, Helvetica, Arial, sans-serif' font-size='13' font-weight='700' fill='#111827' text-anchor='start'>10%</text><text x='866' y='502' font-family='-apple-system, Segoe UI, Helvetica, Arial, sans-serif' font-size='13' font-weight='400' fill='#374151' text-anchor='start'>every PR waits for you</text><text x='310' y='560' font-family='-apple-system, Segoe UI, Helvetica, Arial, sans-serif' font-size='15' font-weight='700' fill='#111827' text-anchor='end'>Merge + integrate</text><rect x='330' y='542' width='520' height='26' rx='6' fill='#f3f4f6'/><rect x='330' y='542' width='364.0' height='26' rx='6' fill='#d97706'/><line x1='824.0' y1='536' x2='824.0' y2='574' stroke='#111827' stroke-width='3'/><text x='338' y='561' font-family='-apple-system, Segoe UI, Helvetica, Arial, sans-serif' font-size='13' font-weight='700' fill='white' text-anchor='start'>70%</text><text x='866' y='560' font-family='-apple-system, Segoe UI, Helvetica, Arial, sans-serif' font-size='13' font-weight='400' fill='#374151' text-anchor='start'>gate + repair fixed today; edge cases still surfacing</text><text x='310' y='618' font-family='-apple-system, Segoe UI, Helvetica, Arial, sans-serif' font-size='15' font-weight='700' fill='#111827' text-anchor='end'>Deploy (both Macs, apps)</text><rect x='330' y='600' width='520' height='26' rx='6' fill='#f3f4f6'/><rect x='330' y='600' width='234.0' height='26' rx='6' fill='#dc2626'/><line x1='824.0' y1='594' x2='824.0' y2='632' stroke='#111827' stroke-width='3'/><text x='338' y='619' font-family='-apple-system, Segoe UI, Helvetica, Arial, sans-serif' font-size='13' font-weight='700' fill='white' text-anchor='start'>45%</text><text x='866' y='618' font-family='-apple-system, Segoe UI, Helvetica, Arial, sans-serif' font-size='13' font-weight='400' fill='#374151' text-anchor='start'>30-min sync; app rebuild lags; server restarts</text><text x='310' y='676' font-family='-apple-system, Segoe UI, Helvetica, Arial, sans-serif' font-size='15' font-weight='700' fill='#111827' text-anchor='end'>Recovery (stale, sent back)</text><rect x='330' y='658' width='520' height='26' rx='6' fill='#f3f4f6'/><rect x='330' y='658' width='156.0' height='26' rx='6' fill='#dc2626'/><line x1='798.0' y1='652' x2='798.0' y2='690' stroke='#111827' stroke-width='3'/><text x='338' y='677' font-family='-apple-system, Segoe UI, Helvetica, Arial, sans-serif' font-size='13' font-weight='700' fill='white' text-anchor='start'>30%</text><text x='866' y='676' font-family='-apple-system, Segoe UI, Helvetica, Arial, sans-serif' font-size='13' font-weight='400' fill='#374151' text-anchor='start'>stale_claims and refeed are propose-only</text><text x='310' y='734' font-family='-apple-system, Segoe UI, Helvetica, Arial, sans-serif' font-size='15' font-weight='700' fill='#111827' text-anchor='end'>Outcomes / purpose checks</text><rect x='330' y='716' width='520' height='26' rx='6' fill='#f3f4f6'/><rect x='330' y='716' width='52.0' height='26' rx='6' fill='#9ca3af'/><line x1='746.0' y1='710' x2='746.0' y2='748' stroke='#111827' stroke-width='3'/><text x='338' y='735' font-family='-apple-system, Segoe UI, Helvetica, Arial, sans-serif' font-size='13' font-weight='700' fill='#111827' text-anchor='start'>10%</text><text x='866' y='734' font-family='-apple-system, Segoe UI, Helvetica, Arial, sans-serif' font-size='13' font-weight='400' fill='#374151' text-anchor='start'>built (#304), few tickets carry a metric yet</text><text x='310' y='792' font-family='-apple-system, Segoe UI, Helvetica, Arial, sans-serif' font-size='15' font-weight='700' fill='#111827' text-anchor='end'>Goals → tickets (north stars)</text><rect x='330' y='774' width='520' height='26' rx='6' fill='#f3f4f6'/><rect x='330' y='774' width='104.0' height='26' rx='6' fill='#9ca3af'/><line x1='746.0' y1='768' x2='746.0' y2='806' stroke='#111827' stroke-width='3'/><text x='338' y='793' font-family='-apple-system, Segoe UI, Helvetica, Arial, sans-serif' font-size='13' font-weight='700' fill='white' text-anchor='start'>20%</text><text x='866' y='792' font-family='-apple-system, Segoe UI, Helvetica, Arial, sans-serif' font-size='13' font-weight='400' fill='#374151' text-anchor='start'>north stars guide planning; no goal loop yet</text><text x='590.0' y='838' font-family='-apple-system, Segoe UI, Helvetica, Arial, sans-serif' font-size='13' font-weight='400' fill='#4b5563' text-anchor='middle'>colored bar = today   ·   black line = where you want to be</text></svg>
