<svg xmlns='http://www.w3.org/2000/svg' width='1240' height='420' viewBox='0 0 1240 420'><defs><marker id='a374151' viewBox='0 0 10 10' refX='9' refY='5' markerWidth='7' markerHeight='7' orient='auto-start-reverse'><path d='M0,0 L10,5 L0,10 z' fill='#374151'/></marker><marker id='a16a34a' viewBox='0 0 10 10' refX='9' refY='5' markerWidth='7' markerHeight='7' orient='auto-start-reverse'><path d='M0,0 L10,5 L0,10 z' fill='#16a34a'/></marker><marker id='a4f46e5' viewBox='0 0 10 10' refX='9' refY='5' markerWidth='7' markerHeight='7' orient='auto-start-reverse'><path d='M0,0 L10,5 L0,10 z' fill='#4f46e5'/></marker><marker id='ad97706' viewBox='0 0 10 10' refX='9' refY='5' markerWidth='7' markerHeight='7' orient='auto-start-reverse'><path d='M0,0 L10,5 L0,10 z' fill='#d97706'/></marker><marker id='adc2626' viewBox='0 0 10 10' refX='9' refY='5' markerWidth='7' markerHeight='7' orient='auto-start-reverse'><path d='M0,0 L10,5 L0,10 z' fill='#dc2626'/></marker><marker id='a9ca3af' viewBox='0 0 10 10' refX='9' refY='5' markerWidth='7' markerHeight='7' orient='auto-start-reverse'><path d='M0,0 L10,5 L0,10 z' fill='#9ca3af'/></marker></defs><rect width='1240' height='420' fill='white'/><text x='620.0' y='34' font-family='-apple-system, Segoe UI, Helvetica, Arial, sans-serif' font-size='24' font-weight='700' fill='#111827' text-anchor='middle'>Where the time goes — one typical ticket, idea to running</text><rect x='40' y='52' width='22' height='18' rx='4' fill='#dcfce7' stroke='#16a34a' stroke-width='2'/><text x='70' y='66' font-family='-apple-system, Segoe UI, Helvetica, Arial, sans-serif' font-size='14' font-weight='400' fill='#111827' text-anchor='start'>Works on its own</text><rect x='215.2' y='52' width='22' height='18' rx='4' fill='#fef3c7' stroke='#d97706' stroke-width='2'/><text x='245.2' y='66' font-family='-apple-system, Segoe UI, Helvetica, Arial, sans-serif' font-size='14' font-weight='400' fill='#111827' text-anchor='start'>Works, but needs you or is fragile</text><rect x='520.0' y='52' width='22' height='18' rx='4' fill='#fee2e2' stroke='#dc2626' stroke-width='2'/><text x='550.0' y='66' font-family='-apple-system, Segoe UI, Helvetica, Arial, sans-serif' font-size='14' font-weight='400' fill='#111827' text-anchor='start'>Known problem (listed in the doc)</text><rect x='817.6' y='52' width='22' height='18' rx='4' fill='#f3f4f6' stroke='#9ca3af' stroke-width='2'/><text x='847.6' y='66' font-family='-apple-system, Segoe UI, Helvetica, Arial, sans-serif' font-size='14' font-weight='400' fill='#111827' text-anchor='start'>Planned, not built</text><rect x='1007.2' y='52' width='22' height='18' rx='4' fill='#e0e7ff' stroke='#4f46e5' stroke-width='2'/><text x='1037.2' y='66' font-family='-apple-system, Segoe UI, Helvetica, Arial, sans-serif' font-size='14' font-weight='400' fill='#111827' text-anchor='start'>Your step</text><rect x='40' y='130' width='50.0' height='70' fill='#16a34a' stroke='white' stroke-width='2'/><rect x='90.0' y='130' width='50.0' height='70' fill='#16a34a' stroke='white' stroke-width='2'/><rect x='140.0' y='130' width='41.666666666666664' height='70' fill='#16a34a' stroke='white' stroke-width='2'/><rect x='181.66666666666666' y='130' width='940.0' height='70' fill='#dc2626' stroke='white' stroke-width='2'/><text x='651.6666666666666' y='162' font-family='-apple-system, Segoe UI, Helvetica, Arial, sans-serif' font-size='14' font-weight='700' fill='white' text-anchor='middle'>WAIT FOR YOUR APPROVE</text><text x='651.6666666666666' y='182' font-family='-apple-system, Segoe UI, Helvetica, Arial, sans-serif' font-size='13' font-weight='400' fill='white' text-anchor='middle'>~9.4 h (measured median)</text><rect x='1121.6666666666667' y='130' width='4' height='70' fill='#16a34a' stroke='white' stroke-width='2'/><rect x='1125.6666666666667' y='130' width='75.0' height='70' fill='#dc2626' stroke='white' stroke-width='2'/><text x='40' y='240' font-family='-apple-system, Segoe UI, Helvetica, Arial, sans-serif' font-size='15' font-weight='400' fill='#111827' text-anchor='start'>Small slices (left): triage ~30 min, scan ~30 min, build ~25 min, merge ~2 min — the machine parts are fast.</text><text x='40' y='270' font-family='-apple-system, Segoe UI, Helvetica, Arial, sans-serif' font-size='15' font-weight='700' fill='#dc2626' text-anchor='start'>Big slices (red): waiting for Approve (median 9.4 h over the last 46 pipeline PRs) and for the code to reach both Macs.</text><text x='40' y='300' font-family='-apple-system, Segoe UI, Helvetica, Arial, sans-serif' font-size='15' font-weight='400' fill='#111827' text-anchor='start'>So: the fastest way to more flow is not faster agents, it is less waiting (auto-merge for low-risk PRs, deploy on merge).</text><text x='40' y='360' font-family='-apple-system, Segoe UI, Helvetica, Arial, sans-serif' font-size='13' font-weight='400' fill='#6b7280' text-anchor='start'>Approve wait is measured (PR opened → merged, 2026-10-02 to 10-09). The other slices are estimates: hourly scans, 10–40 min builds, 30-min sync.</text></svg>
