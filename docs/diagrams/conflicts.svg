<svg xmlns='http://www.w3.org/2000/svg' width='1240' height='760' viewBox='0 0 1240 760'><defs><marker id='a374151' viewBox='0 0 10 10' refX='9' refY='5' markerWidth='7' markerHeight='7' orient='auto-start-reverse'><path d='M0,0 L10,5 L0,10 z' fill='#374151'/></marker><marker id='a16a34a' viewBox='0 0 10 10' refX='9' refY='5' markerWidth='7' markerHeight='7' orient='auto-start-reverse'><path d='M0,0 L10,5 L0,10 z' fill='#16a34a'/></marker><marker id='a4f46e5' viewBox='0 0 10 10' refX='9' refY='5' markerWidth='7' markerHeight='7' orient='auto-start-reverse'><path d='M0,0 L10,5 L0,10 z' fill='#4f46e5'/></marker><marker id='ad97706' viewBox='0 0 10 10' refX='9' refY='5' markerWidth='7' markerHeight='7' orient='auto-start-reverse'><path d='M0,0 L10,5 L0,10 z' fill='#d97706'/></marker><marker id='adc2626' viewBox='0 0 10 10' refX='9' refY='5' markerWidth='7' markerHeight='7' orient='auto-start-reverse'><path d='M0,0 L10,5 L0,10 z' fill='#dc2626'/></marker><marker id='a9ca3af' viewBox='0 0 10 10' refX='9' refY='5' markerWidth='7' markerHeight='7' orient='auto-start-reverse'><path d='M0,0 L10,5 L0,10 z' fill='#9ca3af'/></marker></defs><rect width='1240' height='760' fill='white'/><text x='620.0' y='34' font-family='-apple-system, Segoe UI, Helvetica, Arial, sans-serif' font-size='24' font-weight='700' fill='#111827' text-anchor='middle'>When a PR conflicts with main — cheap repair first, then who does what</text><rect x='40' y='52' width='22' height='18' rx='4' fill='#dcfce7' stroke='#16a34a' stroke-width='2'/><text x='70' y='66' font-family='-apple-system, Segoe UI, Helvetica, Arial, sans-serif' font-size='14' font-weight='400' fill='#111827' text-anchor='start'>Works on its own</text><rect x='215.2' y='52' width='22' height='18' rx='4' fill='#fef3c7' stroke='#d97706' stroke-width='2'/><text x='245.2' y='66' font-family='-apple-system, Segoe UI, Helvetica, Arial, sans-serif' font-size='14' font-weight='400' fill='#111827' text-anchor='start'>Works, but needs you or is fragile</text><rect x='520.0' y='52' width='22' height='18' rx='4' fill='#fee2e2' stroke='#dc2626' stroke-width='2'/><text x='550.0' y='66' font-family='-apple-system, Segoe UI, Helvetica, Arial, sans-serif' font-size='14' font-weight='400' fill='#111827' text-anchor='start'>Known problem (listed in the doc)</text><rect x='817.6' y='52' width='22' height='18' rx='4' fill='#f3f4f6' stroke='#9ca3af' stroke-width='2'/><text x='847.6' y='66' font-family='-apple-system, Segoe UI, Helvetica, Arial, sans-serif' font-size='14' font-weight='400' fill='#111827' text-anchor='start'>Planned, not built</text><rect x='1007.2' y='52' width='22' height='18' rx='4' fill='#e0e7ff' stroke='#4f46e5' stroke-width='2'/><text x='1037.2' y='66' font-family='-apple-system, Segoe UI, Helvetica, Arial, sans-serif' font-size='14' font-weight='400' fill='#111827' text-anchor='start'>Your step</text><rect x='470' y='110' width='300' height='70' rx='10' fill='#fef3c7' stroke='#d97706' stroke-width='2'/><text x='620.0' y='140.33333333333334' font-family='-apple-system, Segoe UI, Helvetica, Arial, sans-serif' font-size='14' font-weight='700' fill='#111827' text-anchor='middle'>GitHub: CONFLICTING</text><text x='620.0' y='158.33333333333334' font-family='-apple-system, Segoe UI, Helvetica, Arial, sans-serif' font-size='13' font-weight='400' fill='#111827' text-anchor='middle'>found by the after-merge check or the scan</text><rect x='420' y='230' width='400' height='80' rx='10' fill='#dcfce7' stroke='#16a34a' stroke-width='2'/><text x='620.0' y='257.0' font-family='-apple-system, Segoe UI, Helvetica, Arial, sans-serif' font-size='13' font-weight='700' fill='#111827' text-anchor='middle'>CHEAP REPAIR (conflict_repair.py)</text><text x='620.0' y='274.0' font-family='-apple-system, Segoe UI, Helvetica, Arial, sans-serif' font-size='12' font-weight='400' fill='#111827' text-anchor='middle'>rebase in a scratch copy; resolve only safe conflicts:</text><text x='620.0' y='291.0' font-family='-apple-system, Segoe UI, Helvetica, Arial, sans-serif' font-size='12' font-weight='400' fill='#111827' text-anchor='middle'>generated files · already on main · both only ADDED</text><line x1='620' y1='180' x2='620' y2='226' stroke='#374151' stroke-width='2.5' marker-end='url(#a374151)'/><polygon points='620,350.0 770.0,400 620,450.0 470.0,400' fill='#fef3c7' stroke='#d97706' stroke-width='2'/><text x='620' y='395.6666666666667' font-family='-apple-system, Segoe UI, Helvetica, Arial, sans-serif' font-size='14' font-weight='700' fill='#111827' text-anchor='middle'>All conflicts safe,</text><text x='620' y='413.6666666666667' font-family='-apple-system, Segoe UI, Helvetica, Arial, sans-serif' font-size='14' font-weight='400' fill='#111827' text-anchor='middle'>and tests pass?</text><line x1='620' y1='310' x2='620' y2='348' stroke='#374151' stroke-width='2.5' marker-end='url(#a374151)'/><rect x='940' y='365' width='270' height='70' rx='10' fill='#dcfce7' stroke='#16a34a' stroke-width='2'/><text x='1075.0' y='395.3333333333333' font-family='-apple-system, Segoe UI, Helvetica, Arial, sans-serif' font-size='14' font-weight='700' fill='#111827' text-anchor='middle'>PUSHED ✅</text><text x='1075.0' y='413.3333333333333' font-family='-apple-system, Segoe UI, Helvetica, Arial, sans-serif' font-size='13' font-weight='400' fill='#111827' text-anchor='middle'>comment says what was resolved</text><line x1='770' y1='400' x2='936' y2='400' stroke='#374151' stroke-width='2.5' marker-end='url(#a374151)'/><text x='853.0' y='392' font-family='-apple-system, Segoe UI, Helvetica, Arial, sans-serif' font-size='13' font-weight='400' fill='#374151' text-anchor='middle'>yes</text><polygon points='620,510.0 770.0,560 620,610.0 470.0,560' fill='#fef3c7' stroke='#d97706' stroke-width='2'/><text x='620' y='555.6666666666666' font-family='-apple-system, Segoe UI, Helvetica, Arial, sans-serif' font-size='14' font-weight='700' fill='#111827' text-anchor='middle'>Made by the</text><text x='620' y='573.6666666666666' font-family='-apple-system, Segoe UI, Helvetica, Arial, sans-serif' font-size='14' font-weight='400' fill='#111827' text-anchor='middle'>pipeline?</text><line x1='620' y1='450' x2='620' y2='508' stroke='#374151' stroke-width='2.5' marker-end='url(#a374151)'/><text x='632' y='485' font-family='-apple-system, Segoe UI, Helvetica, Arial, sans-serif' font-size='13' font-weight='400' fill='#374151' text-anchor='start'>no (a real conflict)</text><rect x='940' y='525' width='270' height='70' rx='10' fill='#fef3c7' stroke='#d97706' stroke-width='2'/><text x='1075.0' y='555.3333333333334' font-family='-apple-system, Segoe UI, Helvetica, Arial, sans-serif' font-size='14' font-weight='700' fill='#111827' text-anchor='middle'>SENT BACK</text><text x='1075.0' y='573.3333333333334' font-family='-apple-system, Segoe UI, Helvetica, Arial, sans-serif' font-size='13' font-weight='400' fill='#111827' text-anchor='middle'>rebuilt on main; files named</text><rect x='30' y='525' width='300' height='70' rx='10' fill='#e0e7ff' stroke='#4f46e5' stroke-width='2'/><text x='180.0' y='555.3333333333334' font-family='-apple-system, Segoe UI, Helvetica, Arial, sans-serif' font-size='14' font-weight='700' fill='#111827' text-anchor='middle'>FLAGGED FOR YOU</text><text x='180.0' y='573.3333333333334' font-family='-apple-system, Segoe UI, Helvetica, Arial, sans-serif' font-size='13' font-weight='400' fill='#111827' text-anchor='middle'>once per commit; never auto-rebuilt</text><line x1='770' y1='560' x2='936' y2='560' stroke='#374151' stroke-width='2.5' marker-end='url(#a374151)'/><text x='853.0' y='552' font-family='-apple-system, Segoe UI, Helvetica, Arial, sans-serif' font-size='13' font-weight='400' fill='#374151' text-anchor='middle'>yes</text><line x1='470' y1='560' x2='334' y2='560' stroke='#374151' stroke-width='2.5' marker-end='url(#a374151)'/><text x='402.0' y='552' font-family='-apple-system, Segoe UI, Helvetica, Arial, sans-serif' font-size='13' font-weight='400' fill='#374151' text-anchor='middle'>no (hand-made)</text><text x='620' y='690' font-family='-apple-system, Segoe UI, Helvetica, Arial, sans-serif' font-size='14' font-weight='400' fill='#4b5563' text-anchor='middle'>Safe = nobody's existing line was changed on both sides. Anything else is a real conflict and is never papered over.</text><text x='620' y='715' font-family='-apple-system, Segoe UI, Helvetica, Arial, sans-serif' font-size='13' font-weight='400' fill='#6b7280' text-anchor='middle'>Max 2 repairs per scan (each runs the tests). A commit that failed a repair isn't retried; a new push gets a new try.</text></svg>
