6666666667' font-family='-apple-system, Segoe UI, Helvetica, Arial, sans-serif' font-size='14' font-weight='400' fill='#111827' text-anchor='middle'>checks pass?</text><polygon points='470,540.0 620.0,590 470,640.0 320.0,590' fill='#fef3c7' stroke='#d97706' stroke-width='2'/><text x='470' y='594.6666666666666' font-family='-apple-system, Segoe UI, Helvetica, Arial, sans-serif' font-size='14' font-weight='700' fill='#111827' text-anchor='middle'>Is it behind main?</text><polygon points='470,680.0 620.0,730 470,780.0 320.0,730' fill='#fef3c7' stroke='#d97706' stroke-width='2'/><text x='470' y='725.6666666666666' font-family='-apple-system, Segoe UI, Helvetica, Arial, sans-serif' font-size='14' font-weight='700' fill='#111827' text-anchor='middle'>Did main change</text><text x='470' y='743.6666666666666' font-family='-apple-system, Segoe UI, Helvetica, Arial, sans-serif' font-size='14' font-weight='400' fill='#111827' text-anchor='middle'>files it changes?</text><line x1='470' y1='220' x2='470' y2='258' stroke='#374151' stroke-width='2.5' marker-end='url(#a374151)'/><text x='482' y='244.0' font-family='-apple-system, Segoe UI, Helvetica, Arial, sans-serif' font-size='13' font-weight='400' fill='#374151' text-anchor='start'>yes</text><line x1='470' y1='360' x2='470' y2='398' stroke='#374151' stroke-width='2.5' marker-end='url(#a374151)'/><text x='482' y='384.0' font-family='-apple-system, Segoe UI, Helvetica, Arial, sans-serif' font-size='13' font-weight='400' fill='#374151' text-anchor='start'>no</text><line x1='470' y1='500' x2='470' y2='538' stroke='#374151' stroke-width='2.5' marker-end='url(#a374151)'/><text x='482' y='524.0' font-family='-apple-system, Segoe UI, Helvetica, Arial, sans-serif' font-size='13' font-weight='400' fill='#374151' text-anchor='start'>yes</text><line x1='470' y1='640' x2='470' y2='678' stroke='#374151' stroke-width='2.5' marker-end='url(#a374151)'/><text x='482' y='664.0' font-family='-apple-system, Segoe UI, Helvetica, Arial, sans-serif' font-size='13' font-weight='400' fill='#374151' text-anchor='start'>yes</text><rect x='760' y='135' width='430' height='70' rx='10' fill='#fef3c7' stroke='#d97706' stroke-width='2'/><text x='975.0' y='165.33333333333334' font-family='-apple-system, Segoe UI, Helvetica, Arial, sans-serif' font-size='14' font-weight='700' fill='#111827' text-anchor='middle'>REFUSED: WRONG_BASE</text><text x='975.0' y='183.33333333333334' font-family='-apple-system, Segoe UI, Helvetica, Arial, sans-serif' font-size='13' font-weight='400' fill='#111827' text-anchor='middle'>stacked PR: merge its parent first (moves itself)</text><rect x='760' y='275' width='430' height='70' rx='10' fill='#fef3c7' stroke='#d97706' stroke-width='2'/><text x='975.0' y='305.3333333333333' font-family='-apple-system, Segoe UI, Helvetica, Arial, sans-serif' font-size='14' font-weight='700' fill='#111827' text-anchor='middle'>REFUSED: SENT_BACK</text><text x='975.0' y='323.3333333333333' font-family='-apple-system, Segoe UI, Helvetica, Arial, sans-serif' font-size='13' font-weight='400' fill='#111827' text-anchor='middle'>a rebuild will update this same PR</text><rect x='760' y='415' width='430' height='70' rx='10' fill='#fef3c7' stroke='#d97706' stroke-width='2'/><text x='975.0' y='445.3333333333333' font-family='-apple-system, Segoe UI, Helvetica, Arial, sans-serif' font-size='14' font-weight='700' fill='#111827' text-anchor='middle'>WAIT (running) or SENT BACK (failed)</text><text x='975.0' y='463.3333333333333' font-family='-apple-system, Segoe UI, Helvetica, Arial, sans-serif' font-size='13' font-weight='400' fill='#111827' text-anchor='middle'>failing checks go back to the ticket</text><rect x='40' y='555' width='250' height='70' rx='10' fill='#dcfce7' stroke='#16a34a' stroke-width='2'/><text x='165.0' y='585.1666666666666' font-family='-apple-system, Segoe UI, Helvetica, Arial, sans-serif' font-size='15' font-weight='700' fill='#111827' text-anchor='middle'>MERGE NOW</text><text x='165.0' y='604.1666666666666' font-family='-apple-system, Segoe UI, Helvetica, Arial, sans-serif' font-size='14' font-weight='400' fill='#111827' text-anchor='middle'>seconds</text><rect x='40' y='695' width='250' height='70' rx='10' fill='#dcfce7' stroke='#16a34a' stroke-width='2'/><text x='165.0' y='725.1666666666666' font-family='-apple-system, Segoe UI, Helvetica, Arial, sans-serif' font-size='15' font-weight='700' fill='#111827' text-anchor='middle'>MERGE NOW</text><text x='165.0' y='744.1666666666666' font-family='-apple-system, Segoe UI, Helvetica, Arial, sans-serif' font-size='14' font-weight='400' fill='#111827' text-anchor='middle'>'no retest needed'</text><rect x='760' y='695' width='430' height='70' rx='10' fill='#dcfce7' stroke='#16a34a' stroke-width='2'/><text x='975.0' y='725.3333333333334' font-family='-apple-system, Segoe UI, Helvetica, Arial, sans-serif' font-size='14' font-weight='700' fill='#111827' text-anchor='middle'>REBASE + RETEST</text><text x='975.0' y='743.3333333333334' font-family='-apple-system, Segoe UI, Helvetica, Arial, sans-serif' font-size='13' font-weight='400' fill='#111827' text-anchor='middle'>the full suite on the rebased branch (≤ 40 min)</text><line x1='620' y1='170' x2='756' y2='170' stroke='#374151' stroke-width='2.5' marker-end='url(#a374151)'/><text x='688.0' y='162' font-family='-apple-system, Segoe UI, Helvetica, Arial, sans-serif' font-size='13' font-weight='400' fill='#374151' text-anchor='middle'>no</text><line x1='620' y1='310' x2='756' y2='310' stroke='#374151' stroke-width='2.5' marker-end='url(#a374151)'/><text x='688.0' y='302' font-family='-apple-system, Segoe UI, Helvetica, Arial, sans-serif' font-size='13' font-weight='400' fill='#374151' text-anchor='middle'>yes</text><line x1='620' y1='450' x2='756' y2='450' stroke='#374151' stroke-width='2.5' marker-end='url(#a374151)'/><text x='688.0' y='442' font-family='-apple-system, Segoe UI, Helvetica, Arial, sans-serif' font-size='13' font-weight='400' fill='#374151' text-anchor='middle'>no</text><line x1='320' y1='590' x2='294' y2='590' stroke='#374151' stroke-width='2.5' marker-end='url(#a374151)'/><text x='307.0' y='582' font-family='-apple-system, Segoe UI, Helvetica, Arial, sans-serif' font-size='13' font-weight='400' fill='#374151' text-anchor='middle'>no</text><line x1='320' y1='730' x2='294' y2='730' stroke='#374151' stroke-width='2.5' marker-end='url(#a374151)'/><text x='307.0' y='722' font-family='-apple-system, Segoe UI, Helvetica, Arial, sans-serif' font-size='13' font-weight='400' fill='#374151' text-anchor='middle'>no</text><line x1='620' y1='730' x2='756' y2='730' stroke='#374151' stroke-width='2.5' marker-end='url(#a374151)'/><text x='688.0' y='722' font-family='-apple-system, Segoe UI, Helvetica, Arial, sans-serif' font-size='13' font-weight='400' fill='#374151' text-anchor='middle'>yes</text><polygon points='975,810.0 1125.0,860 975,910.0 825.0,860' fill='#fef3c7' stroke='#d97706' stroke-width='2'/><text x='975' y='864.6666666666666' font-family='-apple-system, Segoe UI, Helvetica, Arial, sans-serif' font-size='14' font-weight='700' fill='#111827' text-anchor='middle'>Do the tests pass?</text><line x1='975' y1='765' x2='975' y2='808' stroke='#374151' stroke-width='2.5' marker-end='url(#a374151)'/><rect x='40' y='900' width='330' height='70' rx='10' fill='#dcfce7' stroke='#16a34a' stroke-width='2'/><text x='205.0' y='930.1666666666666' font-family='-apple-system, Segoe UI, Helvetica, Arial, sans-serif' font-size='15' font-weight='700' fill='#111827' text-anchor='middle'>MERGE</text><text x='205.0' y='949.1666666666666' font-family='-apple-system, Segoe UI, Helvetica, Arial, sans-serif' font-size='14' font-weight='400' fill='#111827' text-anchor='middle'>then everything in 'After the merge'</text><rect x='760' y='960' width='430' height='70' rx='10' fill='#fee2e2' stroke='#dc2626' stroke-width='3'/><text x='975.0' y='990.5' font-family='-apple-system, Segoe UI, Helvetica, Arial, sans-serif' font-size='13' font-weight='700' fill='#111827' text-anchor='middle'>NOT MERGED</text><text x='975.0' y='1007.5' font-family='-apple-system, Segoe UI, Helvetica, Arial, sans-serif' font-size='12' font-weight='400' fill='#111827' text-anchor='middle'>main already red? → MAIN_RED, nothing sent back; else sent back</text><line x1='825' y1='860' x2='374' y2='935' stroke='#374151' stroke-width='2.5' marker-end='url(#a374151)'/><text x='600' y='890' font-family='-apple-system, Segoe UI, Helvetica, Arial, sans-serif' font-size='13' font-weight='400' fill='#374151' text-anchor='middle'>yes</text><line x1='975' y1='910' x2='975' y2='956' stroke='#374151' stroke-width='2.5' marker-end='url(#a374151)'/><text x='985' y='940' font-family='-apple-system, Segoe UI, Helvetica, Arial, sans-serif' font-size='13' font-weight='400' fill='#374151' text-anchor='start'>no</text><text x='620' y='1050' font-family='-apple-system, Segoe UI, Helvetica, Arial, sans-serif' font-size='13' font-weight='400' fill='#4b5563' text-anchor='middle'>Can't tell if files overlap? It retests, to be safe. The machine broke, not the code? GATE_INFRA: approve again.</text></svg>
